name: Configure verified free transactional mail
on:
  workflow_dispatch:
    inputs:
      revision:
        type: string
        required: true
        description: Full tested mail release revision already live on the website
      sender:
        type: choice
        required: true
        options: [jouw2023@gmail.com]
permissions:
  contents: read
concurrency:
  group: deploy-production
  cancel-in-progress: false
jobs:
  configure:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    steps:
      - name: Require the reviewed source to be reachable from main
        env:
          GH_TOKEN: ${{ github.token }}
          REVISION: ${{ inputs.revision }}
        run: |
          node --input-type=module <<'GATE'
          if(process.env.GITHUB_REF!=='refs/heads/main')throw Error('Mail installer must use reviewed main');
          if(!/^[a-f0-9]{40}$/.test(process.env.REVISION||''))throw Error('Full tested revision required');
          const response=await fetch('https://api.github.com/repos/'+process.env.GITHUB_REPOSITORY+'/compare/'+process.env.REVISION+'...main',{headers:{Authorization:'Bearer '+process.env.GH_TOKEN,Accept:'application/vnd.github+json'},signal:AbortSignal.timeout(20000)});
          if(!response.ok||!['identical','ahead'].includes((await response.json()).status))throw Error('Reviewed main ancestry required');
          GATE
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Configure free sender without exposing runtime credentials
        env:
          REVISION: ${{ inputs.revision }}
          SENDER: ${{ inputs.sender }}
          BREVO_KEY: ${{ secrets.BREVO_API_KEY }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          [[ "$REVISION" =~ ^[a-f0-9]{40}$ ]]
          [[ "$SENDER" = jouw2023@gmail.com ]]
          [[ "$DEPLOY_HOST" =~ ^[a-zA-Z0-9][a-zA-Z0-9.-]*$ ]]
          [[ "$DEPLOY_USER" =~ ^[a-z_][a-z0-9_-]*$ ]]
          test -n "$BREVO_KEY" && test -n "$DEPLOY_KEY" && test -n "$KNOWN_HOSTS"
          keydir=$(mktemp -d)
          trap 'rm -rf "$keydir"' EXIT
          printf '%s\n' "$DEPLOY_KEY" > "$keydir/key"
          printf '%s\n' "$KNOWN_HOSTS" > "$keydir/known_hosts"
          args=(-i "$keydir/key" -o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$keydir/known_hosts" -o ConnectTimeout=20)
          ssh "${args[@]}" "$DEPLOY_USER@$DEPLOY_HOST" 'umask 077; mkdir -p /srv/jouw-driver/mail-setup; chmod 700 /srv/jouw-driver/mail-setup' </dev/null
          scp "${args[@]}" deploy/configure-mail.mjs "$DEPLOY_USER@$DEPLOY_HOST:/srv/jouw-driver/mail-setup/configure-mail.mjs"
          printf '%s' "$BREVO_KEY" | ssh "${args[@]}" "$DEPLOY_USER@$DEPLOY_HOST" "cd /srv/jouw-driver/foundation; node /srv/jouw-driver/mail-setup/configure-mail.mjs '$REVISION' '$SENDER'"
