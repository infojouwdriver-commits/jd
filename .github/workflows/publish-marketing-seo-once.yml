name: One-time verified marketing SEO publication
on:
  push:
    branches: [main]
    paths: ['.github/workflows/publish-marketing-seo-once.yml']
permissions:
  contents: read
concurrency:
  group: marketing-seo-once
  cancel-in-progress: false

jobs:
  scope:
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    permissions:
      contents: read
    steps:
      - name: Confirm reviewed scope and exact main release
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_BASELINE: f1f28bd9cad4b1ceebf1b7e865c5115ceb06abfc
        run: |
          node --input-type=module <<'GATE'
          const baseline=process.env.EXPECTED_BASELINE;
          if(process.env.GITHUB_REF!=='refs/heads/main')throw Error('Main branch required');
          if(!/^[a-f0-9]{40}$/.test(process.env.GITHUB_SHA))throw Error('Invalid source revision');
          const headers={Accept:'application/vnd.github+json',Authorization:'Bearer '+process.env.GH_TOKEN};
          const r=await fetch('https://api.github.com/repos/'+process.env.GITHUB_REPOSITORY+'/compare/'+baseline+'...'+process.env.GITHUB_SHA,{headers,signal:AbortSignal.timeout(20000)});
          if(!r.ok)throw Error('Cannot verify reviewed file scope');
          const c=await r.json();
          const allowed=new Set([
            '.github/workflows/backup-foundation.yml',
            '.github/workflows/publish-marketing-seo-once.yml',
            'docs/CODE_MAP_AR.md','docs/MARKETING_SEO_AR.md',
            'graphify-out/GRAPH_REPORT.md','graphify-out/GRAPH_TREE.html',
            'graphify-out/SOURCE_INDEX.md','graphify-out/graph.json',
            'graphify-out/health.json','graphify-out/source-manifest.json',
            'src/app/[locale]/solutions/[slug]/page.tsx',
            'src/app/[locale]/solutions/page.tsx',
            'src/app/landing/page.tsx','src/app/layout.tsx','src/app/page.tsx',
            'src/app/privacy-center/page.tsx','src/app/robots.ts','src/app/sitemap.ts',
            'src/components/landing/MarketingEditorial.tsx',
            'src/components/landing/MarketingExplore.tsx',
            'src/components/landing/PlatformLanding.tsx',
            'src/contexts/LanguageContext.tsx','src/lib/marketing-content.ts',
            'src/middleware.ts','tests/marketing-seo.test.mjs',
          ]);
          if(c.status!=='ahead'||!c.files?.length||c.files.length>=300||c.files.some(f=>!allowed.has(f.filename)||f.status==='removed'))throw Error('New changes exceed SEO-reviewed scope');
          if(c.files.length<20)throw Error('Required SEO revision absent');
          console.log('Production update limited to reviewed multilingual SEO and backup workflow reuse.');
          GATE

  checks:
    needs: scope
    uses: ./.github/workflows/ci.yml
    with:
      force_native_db: true

  domain:
    needs: scope
    uses: ./.github/workflows/domain-candidate.yml

  build:
    needs: [scope, checks, domain]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.image.outputs.digest }}
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          persist-credentials: false
      - name: Build and publish immutable reviewed website image
        id: image
        env:
          REGISTRY_TOKEN: ${{ github.token }}
          MAPBOX_PUBLIC_TOKEN: ${{ secrets.MAPBOX_PUBLIC_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$MAPBOX_PUBLIC_TOKEN"
          image=ghcr.io/infojouwdriver-commits/jd
          tag="marketing-seo-$GITHUB_SHA-$GITHUB_RUN_ID"
          printf '%s' "$REGISTRY_TOKEN" | docker login ghcr.io -u infojouwdriver-commits --password-stdin >/dev/null
          trap 'docker logout ghcr.io >/dev/null 2>&1 || true' EXIT
          docker build \
            --build-arg NEXT_PUBLIC_PORTAL_ORIGIN=https://app.jouww.com \
            --build-arg NEXT_PUBLIC_MAPBOX_ACCESS_TOKEN="$MAPBOX_PUBLIC_TOKEN" \
            --label "org.opencontainers.image.source=https://github.com/$GITHUB_REPOSITORY" \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" \
            --label "com.jouwdriver.portal-origin=https://app.jouww.com" \
            -t "$image:$tag" .
          docker push "$image:$tag" >/dev/null
          digest=$(docker inspect --format='{{index .RepoDigests 0}}' "$image:$tag")
          [[ "$digest" =~ ^ghcr.io/infojouwdriver-commits/jd@sha256:[a-f0-9]{64}$ ]]
          printf 'digest=%s\n' "$digest" >> "$GITHUB_OUTPUT"
          printf 'Verified immutable marketing image: %s\n' "$digest" >> "$GITHUB_STEP_SUMMARY"

  backup:
    needs: build
    uses: ./.github/workflows/backup-foundation.yml
    with:
      include_restore_tool: true
    secrets: inherit

  publish:
    needs: [scope, checks, domain, build, backup]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: production
    permissions:
      contents: read
      packages: read
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    steps:
      - name: Publish website image with protected rollback and no database migrations
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          REGISTRY_TOKEN: ${{ github.token }}
          IMAGE: ${{ needs.build.outputs.digest }}
          REVISION: ${{ github.sha }}
          BASELINE: f1f28bd9cad4b1ceebf1b7e865c5115ceb06abfc
          BACKUP_TAG: ${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          set -euo pipefail
          umask 077
          [[ "$DEPLOY_HOST" =~ ^[a-zA-Z0-9][a-zA-Z0-9.-]*$ ]]
          [[ "$DEPLOY_USER" =~ ^[a-z_][a-z0-9_-]*$ ]]
          [[ "$IMAGE" =~ ^ghcr.io/infojouwdriver-commits/jd@sha256:[a-f0-9]{64}$ ]]
          [[ "$REVISION" =~ ^[a-f0-9]{40}$ && "$BASELINE" =~ ^[a-f0-9]{40}$ && "$BACKUP_TAG" =~ ^[0-9]+-[0-9]+$ ]]
          test -n "$DEPLOY_KEY" && test -n "$KNOWN_HOSTS"
          keydir=$(mktemp -d)
          trap 'rm -rf "$keydir"' EXIT
          printf '%s\n' "$DEPLOY_KEY" > "$keydir/key"
          printf '%s\n' "$KNOWN_HOSTS" > "$keydir/known_hosts"
          args=(-i "$keydir/key" -o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$keydir/known_hosts" -o ConnectTimeout=20)
          printf '%s\n' "$REGISTRY_TOKEN" | ssh "${args[@]}" "$DEPLOY_USER@$DEPLOY_HOST" "set -eu; umask 077; read -r token; config=\$(mktemp -d); export DOCKER_CONFIG=\"\$config\"; trap 'rm -rf \"\$config\"' EXIT; printf '%s' \"\$token\" | docker login ghcr.io -u infojouwdriver-commits --password-stdin >/dev/null 2>&1; unset token; docker pull '$IMAGE'"
          ssh "${args[@]}" "$DEPLOY_USER@$DEPLOY_HOST" "bash -s -- '$IMAGE' '$REVISION' '$BASELINE' '$BACKUP_TAG'" <<'REMOTE'
          set -euo pipefail
          umask 077
          export MARKETING_IMAGE=$1 MARKETING_REVISION=$2 MARKETING_BASELINE=$3 MARKETING_BACKUP=$4
          cd /srv/jouw-driver/foundation
          test ! -e /srv/jouw-driver/.env
          test -s "/srv/jouw-driver/backups/foundation-$MARKETING_BACKUP.tar.age"
          test "$(sha256sum "/srv/jouw-driver/backups/foundation-$MARKETING_BACKUP.tar.age" | awk '{print $1}')" = "$(cat "/srv/jouw-driver/backups/foundation-$MARKETING_BACKUP.sha256")"
          test "$(docker inspect --format '{{index .Config.Labels "org.opencontainers.image.revision"}}' "$MARKETING_IMAGE")" = "$MARKETING_REVISION"
          mkdir /srv/jouw-driver/.deployment-lock
          work=''
          changed=false
          updated=false
          cleanup(){
            status=$?
            trap - EXIT
            if test "$changed" = true && test "$updated" != true; then
              cat "$work/private-app.yaml" > private-app.yaml
              cat "$work/runtime-mode.json" > runtime-mode.json
              cat "$work/release.json" > /srv/jouw-driver/release.json
              docker compose --env-file .app-staging.env --project-name jouw-driver --file private-app.yaml up -d --no-deps --wait --wait-timeout 180 app </dev/null || printf 'Previous application requires operator recovery\n' >&2
            fi
            test -z "$work" || rm -rf "$work"
            rmdir /srv/jouw-driver/.deployment-lock
            exit "$status"
          }
          trap cleanup EXIT
          node --input-type=module <<'BEFORE'
          import fs from 'node:fs';
          const s=JSON.parse(fs.readFileSync('runtime-mode.json')),r=JSON.parse(fs.readFileSync('/srv/jouw-driver/release.json'));
          if(s.mode!=='public'||s.image!==r.image||s.revision!==r.revision||s.revision!==process.env.MARKETING_BASELINE)throw Error('Live release differs from reviewed SEO baseline; refusing to deploy');
          if(fs.statSync('/srv/jouw-driver/backups/foundation-'+process.env.MARKETING_BACKUP+'.tar.age').mtimeMs<Date.parse(s.deployedAt))throw Error('Backup must cover existing live release');
          const c=fs.readFileSync('private-app.yaml','utf8'),images=c.match(/ghcr\.io\/infojouwdriver-commits\/jd@sha256:[a-f0-9]{64}/g);
          if(images?.length!==1||images[0]!==s.image)throw Error('Live application image mismatch');
          BEFORE
          work=$(mktemp -d .marketing-seo.XXXXXX)
          cp private-app.yaml runtime-mode.json "$work/"
          cp /srv/jouw-driver/release.json "$work/release.json"
          sha256sum .app-staging.env .database.env Caddyfile compose.yaml > "$work/preserved.sha256"
          changed=true
          node --input-type=module <<'IMAGE'
          import fs from 'node:fs';
          const c=fs.readFileSync('private-app.yaml','utf8');
          fs.writeFileSync('private-app.yaml',c.replace(/ghcr\.io\/infojouwdriver-commits\/jd@sha256:[a-f0-9]{64}/,process.env.MARKETING_IMAGE),{mode:0o600});
          IMAGE
          docker compose --env-file .app-staging.env --project-name jouw-driver --file private-app.yaml up -d --no-deps --wait --wait-timeout 180 app </dev/null
          app=$(docker compose --env-file .app-staging.env --project-name jouw-driver --file private-app.yaml ps -q app)
          test "$(docker inspect --format '{{.Config.Image}}' "$app")" = "$MARKETING_IMAGE"
          test "$(docker inspect --format '{{.HostConfig.ReadonlyRootfs}}' "$app")" = true
          test "$(docker inspect --format '{{.State.Health.Status}}' "$app")" = healthy
          docker exec "$app" node scripts/preflight.mjs
          docker exec "$app" node scripts/database-readiness.mjs
          sha256sum --status --check "$work/preserved.sha256"
          node --input-type=module <<'ACCEPT'
          const sites=['https://jouww.com','https://app.jouww.com','https://jouw-driver.duckdns.org'];
          const get=async(url)=>fetch(url,{redirect:'error',signal:AbortSignal.timeout(20000)});
          const marketing=sites[0];
          for(const path of ['/','/fr/solutions','/nl/solutions','/ar/solutions','/fr/solutions/gestion-entreprise-taxi','/robots.txt','/sitemap.xml']){
            const r=await get(marketing+path);
            if(r.status!==200)throw Error('Marketing SEO route did not respond successfully: '+path);
            const body=await r.text();
            if(path==='/sitemap.xml'&&!body.includes('/fr/solutions'))throw Error('SEO sitemap missing public content');
            if(path==='/robots.txt'&&!body.includes('Sitemap: https://jouww.com/sitemap.xml'))throw Error('Public robots sitemap absent');
            if(path==='/fr/solutions'&&!body.includes('https://jouww.com/fr/solutions'))throw Error('SEO canonical missing');
          }
          for(const base of sites.slice(1)){
            const login=await get(base+'/login');
            if(login.status!==200||!login.headers.get('x-robots-tag')?.includes('noindex'))throw Error('Portal login accessibility or indexing guard failed');
            const robots=await get(base+'/robots.txt');
            if(robots.status!==200||(await robots.text()).indexOf('Disallow: /')<0)throw Error('Portal crawler exclusion failed');
          }
          for(const path of ['/next_api/auth/user','/next_api/trips','/next_api/companies']){
            const r=await get(sites[2]+path);
            if(r.status!==401)throw Error('API authorization guard changed');
          }
          console.log('Website SEO, canonical, sitemap, private origin and authentication smoke checks passed.');
          ACCEPT
          node --input-type=module <<'STATE'
          import fs from 'node:fs';
          const old=JSON.parse(fs.readFileSync('runtime-mode.json'));
          const state={...old,image:process.env.MARKETING_IMAGE,revision:process.env.MARKETING_REVISION,deployedAt:new Date().toISOString(),previousImage:old.image,verifiedPrelaunchBackup:process.env.MARKETING_BACKUP};
          for(const p of ['runtime-mode.json','/srv/jouw-driver/release.json'])fs.writeFileSync(p,JSON.stringify(state,null,2)+'\n',{mode:0o600});
          STATE
          updated=true
          printf 'Marketing SEO image deployed; database, billing, driver shifts, mail and TLS settings preserved.\n'
          REMOTE
