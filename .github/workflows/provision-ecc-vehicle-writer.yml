name: Activate the scoped ECC vehicle writer
on:
  workflow_dispatch:
    inputs:
      apply_writer:
        description: Activate editing of the brand and model of unarchived vehicles only
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: deploy-production
  cancel-in-progress: false
jobs:
  provision:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    environment: production
    steps:
      - name: Verify the pinned hosts and apply the audited vehicle writer
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PROD_SSH_HOST: ${{ secrets.DEPLOY_HOST }}
          PROD_SSH_USER: ${{ secrets.DEPLOY_USER }}
          PROD_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          PROD_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          APPLY_WRITER: ${{ inputs.apply_writer }}
          BUNDLE_SHA256: 016749dd8f933d2dbf372f23b5b5c31daecfa6f9275707bc99218d371de4907b
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/main
          [[ "$PROD_SSH_HOST" =~ ^[a-zA-Z0-9][a-zA-Z0-9.-]*$ && "$PROD_SSH_USER" =~ ^[a-z_][a-z0-9_-]*$ ]]
          test -n "$PROD_SSH_KEY" && test -n "$PROD_KNOWN_HOSTS"
          umask 077
          work=$(mktemp -d)
          trap 'rm -rf "$work"' EXIT
          printf '%s\n' "$PROD_SSH_KEY" > "$work/key"
          printf '%s\n' "$PROD_KNOWN_HOSTS" > "$work/prod-known"
          unset PROD_SSH_KEY PROD_KNOWN_HOSTS
          printf '%s\n' '141.94.2.5 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIAGerEd8rI8M08uoDCP9G70IBaxVij+D68/sB0AVN77b' > "$work/ecc-known"
          prod=(ssh -F /dev/null -T -o BatchMode=yes -o IdentitiesOnly=yes -o ConnectTimeout=12 \
            -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$work/prod-known" -i "$work/key" "$PROD_SSH_USER@$PROD_SSH_HOST")
          ecc=(ssh -F /dev/null -T -o BatchMode=yes -o IdentitiesOnly=yes -o ConnectTimeout=12 \
            -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$work/ecc-known" -o HostKeyAlgorithms=ssh-ed25519 -i "$work/key" ubuntu@141.94.2.5)
          "${prod[@]}" 'test "$(hostname -s)" = jouw-driver-prod && test "$(cat /var/lib/cloud/data/instance-id)" = 2cdf743a-d986-4cf7-a026-aa5a59fe480e'
          "${ecc[@]}" 'test "$(hostname -s)" = jouw-driver-ecc && test "$(cat /var/lib/cloud/data/instance-id)" = 4a9ba9db-6ef0-4e54-b1e5-35c530f32645'
          printf '%s\n' 'Both independently pinned OVH instances verified.'
          if [[ "$APPLY_WRITER" != true ]]; then exit 0; fi
          gh api "repos/$GITHUB_REPOSITORY/contents/.ecc-read-provision/vehicle-writer-bundle.txt?ref=ecc-read-provision-inbox" --jq '.content' |
            base64 -d | base64 -d > "$work/package.tar"
          printf '%s  %s\n' "$BUNDLE_SHA256" "$work/package.tar" | sha256sum --check --status
          mkdir "$work/package"
          tar -xf "$work/package.tar" -C "$work/package" --no-same-owner
          remote=ecc-vehicle-writer-$GITHUB_RUN_ID
          [[ "$GITHUB_RUN_ID" =~ ^[0-9]+$ ]]
          "${ecc[@]}" "umask 077; mkdir '$remote'; tar -x -C '$remote'" < "$work/package.tar"
          "${ecc[@]}" "sudo -n bash '$remote/ops/ecc-deploy-vehicle-writer-host.sh' prepare '$GITHUB_RUN_ID'" > "$work/ecc-vehicle-transport.pub"
          tar -cf - -C "$work/package/ops" ecc-deploy-vehicle-writer-production.sh ecc-vehicle-writer.sql audit.sql ecc-scram-verifier.py \
            -C "$work" ecc-vehicle-transport.pub |
            "${prod[@]}" "umask 077; mkdir '$remote'; tar -x -C '$remote'"
          "${prod[@]}" "sudo -n bash '$remote/ecc-deploy-vehicle-writer-production.sh' apply" > "$work/writer.enc"
          if [[ "$(wc -c < "$work/writer.enc")" -ne 384 ]] || \
            ! "${ecc[@]}" "sudo -n bash '$remote/ops/ecc-deploy-vehicle-writer-host.sh' activate '$GITHUB_RUN_ID'" < "$work/writer.enc"; then
            "${prod[@]}" "sudo -n bash '$remote/ecc-deploy-vehicle-writer-production.sh' disable"
            echo 'Vehicle writer login disabled after a failed rollout.' >&2
            exit 1
          fi
