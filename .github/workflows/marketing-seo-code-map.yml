name: Refresh SEO branch code map (temporary)
on:
  push:
    branches:
      - feat/marketing-seo-content-20261028
    paths:
      - .github/workflows/marketing-seo-code-map.yml
permissions:
  contents: write
concurrency:
  group: marketing-seo-map-bootstrap
  cancel-in-progress: false
jobs:
  refresh:
    if: github.repository == 'infojouwdriver-commits/jd'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          persist-credentials: true
          fetch-depth: 1
      - name: Regenerate allowlisted local-only Graphify map
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check --user 'graphifyy[sql]==0.9.92'
          python3 scripts/code-map.py
          python3 scripts/code-map.py --check
      - name: Commit only generated mapping artifacts
        run: |
          set -euo pipefail
          git add -- graphify-out/graph.json graphify-out/GRAPH_REPORT.md graphify-out/GRAPH_TREE.html graphify-out/SOURCE_INDEX.md graphify-out/health.json graphify-out/source-manifest.json
          if git diff --cached --quiet; then
            echo 'Map already current'
            exit 0
          fi
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'chore: refresh local Graphify map after build lint fix'
          git push origin HEAD:feat/marketing-seo-content-20261028
