name: Publish verified minimal company registration
on:
  push:
    branches: [main]
    paths: ['.github/workflows/publish-minimal-company-registration.yml']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
  packages: read
env:
  REVISION: caf83bcc0e4afb8e7bf58de138d429ed05735cfb
  BASELINE: d9daeb8cc8cc548c8c1f8b2336bdff868a44202d
  BUILD_RUN: '45072806379'
jobs:
  accept:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      actions: write
      contents: read
      packages: read
    outputs:
      image: ${{ steps.image.outputs.image }}
      build_attempt: ${{ steps.image.outputs.build_attempt }}
    steps:
      - name: Resolve the immutable candidate from the reviewed build
        id: image
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          export DOCKER_CONFIG="$(mktemp -d)"
          trap 'rm -rf "$DOCKER_CONFIG"' EXIT
          run=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$BUILD_RUN")
          jq -e --arg revision "$REVISION" '.head_sha == $revision and .status == "completed" and .conclusion == "success" and .path == ".github/workflows/release-domain-candidate.yml"' <<<"$run" >/dev/null
          attempt=$(jq -r '.run_attempt' <<<"$run")
          [[ "$attempt" =~ ^[1-9][0-9]*$ ]]
          gh api "repos/$GITHUB_REPOSITORY/compare/$REVISION...${GITHUB_SHA}" |
            jq -e '.status == "ahead" and ([.files[].filename] == [".github/workflows/publish-minimal-company-registration.yml"])' >/dev/null
          printf '%s\n' "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin >/dev/null 2>&1
          tag="ghcr.io/${GITHUB_REPOSITORY,,}:jouww-sha-$REVISION-run-$BUILD_RUN-$attempt"
          docker pull "$tag"
          image=$(docker image inspect --format '{{index .RepoDigests 0}}' "$tag")
          [[ "$image" =~ ^ghcr\.io/infojouwdriver-commits/jd@sha256:[a-f0-9]{64}$ ]]
          printf 'image=%s\nbuild_attempt=%s\n' "$image" "$attempt" >> "$GITHUB_OUTPUT"
      - name: Dispatch and await the existing exact-image acceptance
        id: run
        env:
          GH_TOKEN: ${{ github.token }}
          IMAGE: ${{ steps.image.outputs.image }}
        run: |
          node --input-type=module <<'ACCEPT_JOB'
          import fs from 'node:fs';
          import {execFileSync} from 'node:child_process';
          import {setTimeout} from 'node:timers/promises';
          const {GITHUB_REPOSITORY,GITHUB_SHA,GH_TOKEN,IMAGE,BUILD_RUN}=process.env;
          const headers={Authorization:'Bearer '+GH_TOKEN,Accept:'application/vnd.github+json','Content-Type':'application/json'};
          const base='https://api.github.com/repos/'+GITHUB_REPOSITORY;
          const api=async (path,options={})=>{
            const response=await fetch(base+path,{...options,headers,signal:AbortSignal.timeout(20000)});
            if(!response.ok) throw Error('Image acceptance request failed: HTTP '+response.status);
            return response;
          };
          const workflow='/actions/workflows/verify-domain-image.yml';
          const createdAfter=Date.now()-1000;
          await api(workflow+'/dispatches',{method:'POST',body:JSON.stringify({ref:'main',inputs:{image:IMAGE,release_run:BUILD_RUN}})});
          let runId;
          for(let attempt=0;attempt<70;attempt++){
            const query=await api(workflow+'/runs?branch=main&event=workflow_dispatch&head_sha='+GITHUB_SHA+'&per_page=10');
            const {workflow_runs:runs}=await query.json();
            const run=runId?runs.find(r=>r.id===runId):runs.find(r=>Date.parse(r.created_at)>=createdAfter);
            if(run){
              runId=run.id;
              if(run.status==='completed'){
                if(run.conclusion!=='success')throw Error('Exact-image acceptance failed: '+run.html_url);
                const artifacts=await (await api('/actions/runs/'+run.id+'/artifacts')).json();
                const proof=artifacts.artifacts.find(a=>a.name==='jouww-image-acceptance-'+run.id&&!a.expired);
                if(!proof)throw Error('Exact-image acceptance proof is unavailable');
                const zip=process.env.RUNNER_TEMP+'/minimal-registration-acceptance.zip';
                fs.writeFileSync(zip,Buffer.from(await (await api('/actions/artifacts/'+proof.id+'/zip')).arrayBuffer()),{mode:0o600});
                const result=JSON.parse(execFileSync('unzip',['-p',zip,'candidate-native-proof.json'],{encoding:'utf8'}));
                if(result.candidateImage!==IMAGE||result.passed!==result.checks?.length||
                   !result.checks.includes('Reconstructed schema and full deployment migration sequence applied on native PostgreSQL')){
                  throw Error('Exact image and native PostgreSQL acceptance are required');
                }
                console.log('Verified candidate with acceptance run '+run.id);
                break;
              }
            }
            if(attempt===69)throw Error('Timed out waiting for exact-image acceptance');
            await setTimeout(10000);
          }
          ACCEPT_JOB
  backup:
    needs: accept
    uses: ./.github/workflows/backup-foundation.yml
    secrets: inherit
  publish:
    needs: [accept, backup]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: production
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          ref: ${{ env.REVISION }}
          persist-credentials: false
      - name: Apply the accepted migration and replace the application image
        env:
          GH_TOKEN: ${{ github.token }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          IMAGE: ${{ needs.accept.outputs.image }}
          BACKUP: ${{ github.run_id }}-${{ github.run_attempt }}
          BUILD_ATTEMPT: ${{ needs.accept.outputs.build_attempt }}
        run: |
          set -euo pipefail
          umask 077
          [[ "$DEPLOY_HOST" =~ ^[a-zA-Z0-9][a-zA-Z0-9.-]*$ && "$DEPLOY_USER" =~ ^[a-z_][a-z0-9_-]*$ ]]
          [[ "$IMAGE" =~ ^ghcr\.io/infojouwdriver-commits/jd@sha256:[a-f0-9]{64}$ ]]
          [[ "$BACKUP" =~ ^[0-9]+-[0-9]+$ && "$BUILD_ATTEMPT" =~ ^[0-9]+$ ]]
          test -n "$DEPLOY_KEY" && test -n "$KNOWN_HOSTS"
          transfer=$(mktemp -d)
          trap 'rm -rf "$transfer"' EXIT
          printf '%s\n' "$DEPLOY_KEY" > "$transfer/key"
          printf '%s\n' "$KNOWN_HOSTS" > "$transfer/known_hosts"
          args=(-i "$transfer/key" -o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$transfer/known_hosts" -o ConnectTimeout=20)
          target="$DEPLOY_USER@$DEPLOY_HOST"
          migration=migrations/20261122_minimal_company_registration.sql
          migration_sha=$(sha256sum "$migration" | cut -d' ' -f1)
          dest="/srv/jouw-driver/releases/$REVISION/registration-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          ssh "${args[@]}" "$target" "umask 077; mkdir -p '/srv/jouw-driver/releases/$REVISION'; mkdir '$dest'"
          scp "${args[@]}" "$migration" "$target:$dest/"
          printf '%s\n' "$GH_TOKEN" | ssh "${args[@]}" "$target" "set -eu; umask 077; read -r token; config=\$(mktemp -d); export DOCKER_CONFIG=\"\$config\"; trap 'rm -rf \"\$config\"' EXIT; printf '%s' \"\$token\" | docker login ghcr.io -u infojouwdriver-commits --password-stdin >/dev/null 2>&1; unset token; docker pull '$IMAGE'"
          ssh "${args[@]}" "$target" "bash -s -- '$IMAGE' '$REVISION' '$BASELINE' '$BACKUP' '$BUILD_RUN/$BUILD_ATTEMPT' '$migration_sha' '$dest'" <<'REMOTE'
          set -euo pipefail
          umask 077
          export IMAGE=$1 REVISION=$2 BASELINE=$3 BACKUP=$4 BUILD=$5 MIGRATION_SHA=$6 TRANSFER=$7
          cd /srv/jouw-driver/foundation
          backup_file="/srv/jouw-driver/backups/foundation-$BACKUP.tar.age"
          test "$(sha256sum "$backup_file" | cut -d' ' -f1)" = "$(cat "/srv/jouw-driver/backups/foundation-$BACKUP.sha256")"
          test "$(docker inspect --format '{{index .Config.Labels "org.opencontainers.image.revision"}}' "$IMAGE")" = "$REVISION"
          test "$(docker inspect --format '{{index .Config.Labels "com.jouwdriver.portal-origin"}}' "$IMAGE")" = https://app.jouww.com
          test "$(docker inspect --format '{{index .Config.Labels "com.jouwdriver.build-run"}}' "$IMAGE")" = "$BUILD"
          test "$(sha256sum "$TRANSFER/20261122_minimal_company_registration.sql" | cut -d' ' -f1)" = "$MIGRATION_SHA"
          grep -qx 'APP_ORIGIN=https://app.jouww.com' .app-staging.env
          mkdir /srv/jouw-driver/.deployment-lock
          work=''
          changed=false
          succeeded=false
          cleanup(){
            status=$?
            trap - EXIT
            if test "$changed" = true && test "$succeeded" = false; then
              cp "$work/private-app.yaml" private-app.yaml
              cp "$work/runtime-mode.json" runtime-mode.json
              cp "$work/release.json" /srv/jouw-driver/release.json
              docker compose --env-file .app-staging.env --project-name jouw-driver --file private-app.yaml up -d --no-deps --wait --wait-timeout 180 app </dev/null || printf 'Previous application requires operator recovery\n' >&2
            fi
            test -z "$work" || rm -rf "$work"
            rmdir /srv/jouw-driver/.deployment-lock
            exit "$status"
          }
          trap cleanup EXIT
          work=$(mktemp -d .registration-release.XXXXXX)
          cp private-app.yaml runtime-mode.json "$work/"
          cp /srv/jouw-driver/release.json "$work/release.json"
          sha256sum .app-staging.env .database.env Caddyfile compose.yaml > "$work/preserved.sha256"
          node --input-type=module <<'BEFORE'
          import fs from 'node:fs';
          const state=JSON.parse(fs.readFileSync('runtime-mode.json')),release=JSON.parse(fs.readFileSync('/srv/jouw-driver/release.json'));
          if(state.mode!=='public'||state.image!==release.image||state.revision!==release.revision||state.revision!==process.env.BASELINE) throw Error('Live application revision is outside the approved scope');
          const backup=fs.statSync('/srv/jouw-driver/backups/foundation-'+process.env.BACKUP+'.tar.age');
          if(backup.mtimeMs<Date.parse(state.deployedAt)) throw Error('Backup must cover live application');
          const compose=fs.readFileSync('private-app.yaml','utf8');
          const images=compose.match(/ghcr\.io\/infojouwdriver-commits\/jd@sha256:[a-f0-9]{64}/g);
          if(images?.length!==1||images[0]!==state.image||!compose.includes('/app/cbe-open-data/companies.sqlite')||!compose.includes(':/app/cbe-open-data:ro')) throw Error('Unexpected existing app configuration');
          BEFORE
          node --env-file=.database.env --input-type=module <<'MIGRATE'
          import fs from 'node:fs';
          import {spawnSync} from 'node:child_process';
          const {POSTGREST_SCHEMA,POSTGRES_DB,SCHEMA_ADMIN_USER,SCHEMA_USER,TRANSFER}=process.env;
          if(POSTGREST_SCHEMA!=='public'||POSTGRES_DB!=='jouw_driver'||![SCHEMA_ADMIN_USER,SCHEMA_USER].every(x=>/^[a-z_][a-z0-9_]{0,62}$/.test(x||''))) throw Error('Unexpected database scope');
          const read=name=>{
            const source=fs.readFileSync(TRANSFER+'/'+name,'utf8');
            if(!/^BEGIN;\s/m.test(source)||!/COMMIT;\s*$/.test(source)) throw Error('Unexpected migration transaction');
            return source.replace(/^BEGIN;\s/m,'').replace(/COMMIT;\s*$/,'').replaceAll(':"schema"','"public"').replaceAll(':"admin_role"','"'+SCHEMA_ADMIN_USER+'"').replaceAll(':"user_role"','"'+SCHEMA_USER+'"');
          };
          const sql=["BEGIN; SET LOCAL lock_timeout='5s';",read('20261122_minimal_company_registration.sql'),
            "NOTIFY pgrst, 'reload schema';", 'COMMIT;'].join('\n');
          const result=spawnSync('docker',['compose','--env-file','.database.env','--project-name','jouw-driver','--file','compose.yaml','exec','-T','db','psql','-U','postgres','-d',POSTGRES_DB,'-v','ON_ERROR_STOP=1','-v','VERBOSITY=verbose','-Atq'],{input:sql,encoding:'utf8',timeout:30000});
          if(result.status!==0) throw Error('Registration migration failed ('+(/ERROR:\s+([0-9A-Z]{5}):/.exec(result.stderr||'')?.[1]||'unknown SQLSTATE')+')');
          MIGRATE
          changed=true
          node --input-type=module <<'CONFIG'
          import fs from 'node:fs';
          const file='private-app.yaml';
          const old=JSON.parse(fs.readFileSync('runtime-mode.json'));
          const config=fs.readFileSync(file,'utf8').replace(old.image,process.env.IMAGE);
          fs.writeFileSync(file+'.tmp',config,{mode:0o600});
          fs.renameSync(file+'.tmp',file);
          CONFIG
          docker compose --env-file .app-staging.env --project-name jouw-driver --file private-app.yaml up -d --no-deps --wait --wait-timeout 180 app </dev/null
          app=$(docker compose --env-file .app-staging.env --project-name jouw-driver --file private-app.yaml ps -q app)
          test "$(docker inspect --format '{{.Config.Image}}' "$app")" = "$IMAGE"
          test "$(docker inspect --format '{{.HostConfig.ReadonlyRootfs}}' "$app")" = true
          docker exec "$app" node scripts/preflight.mjs
          docker exec "$app" node scripts/database-readiness.mjs
          sha256sum --status --check "$work/preserved.sha256"
          node --input-type=module <<'ACCEPT'
          const base='https://app.jouww.com';
          const get=(url,options={})=>fetch(url,{...options,redirect:'error',signal:AbortSignal.timeout(15000)});
          for(const path of ['/','/register-company','/login','/driver-login','/privacy-policy']) {
            const response=await get(base+path);
            if(!response.ok||!response.headers.get('content-security-policy')?.includes("default-src 'self'")) throw Error('HTTPS smoke check failed for '+path);
          }
          for(const path of ['/next_api/companies/cbe','/next_api/companies/onboarding']){
            const response=await get(base+path,{method:'POST',headers:{Origin:base,'Content-Type':'application/json'},body:'{}'});
            if(response.status!==401) throw Error('Administration endpoint lost its authentication guard');
          }
          const lookup=await get(base+'/next_api/company-registrations/company-lookup',{
            method:'POST',headers:{Origin:base,'Content-Type':'application/json'},body:JSON.stringify({number:'0200065765',language:'nl'}),
          });
          if(!lookup.ok)throw Error('Live CBE lookup failed: HTTP '+lookup.status);
          const {data}=await lookup.json();
          if(data.source!=='cbe_open_data'||data.snapshot_date!=='2026-11-21'||data.name!=='Intergemeentelijke Vereniging Veneco'||!data.address?.includes('9070')) throw Error('Live CBE fields or source differ from the uploaded snapshot');
          if((await get('https://jouww.com/fr')).status!==200)throw Error('Public marketing page unavailable');
          const malformed=await get(base+'/next_api/company-registrations',{
            method:'POST',headers:{Origin:base,'Content-Type':'application/json'},body:'{}',
          });
          if(malformed.status!==400)throw Error('Registration validation smoke check failed');
          console.log('Production registry populated the name and address from the Belgian Open Data snapshot.');
          ACCEPT
          node --input-type=module <<'STATE'
          import fs from 'node:fs';
          const old=JSON.parse(fs.readFileSync('runtime-mode.json'));
          const state={...old,image:process.env.IMAGE,revision:process.env.REVISION,deployedAt:new Date().toISOString(),previousImage:old.image,verifiedPrelaunchBackup:process.env.BACKUP,cbeSnapshot:'2026-11-21'};
          for(const file of ['runtime-mode.json','/srv/jouw-driver/release.json']){
            fs.writeFileSync(file+'.tmp',JSON.stringify(state,null,2)+'\n',{mode:0o600});
            fs.renameSync(file+'.tmp',file);
          }
          STATE
          succeeded=true
          printf 'Registration deployed and live registry verified.\n'
          REMOTE
