name: Publish verified invoice bank QR
on:
  workflow_dispatch:
    inputs:
      collection_iban:
        type: string
        required: true
        description: IBAN belonging to the configured invoice issuer
      image:
        type: string
        required: true
        description: Immutable GHCR image from the verified release
      revision:
        type: string
        required: true
        description: Exact tested bank QR revision reachable from main
      release_run:
        type: string
        required: true
        description: Successful jouww candidate image run for this revision
      acceptance_run:
        type: string
        required: true
        description: Successful exact jouww image and origin acceptance
      backup_run:
        type: string
        required: true
        description: Recent successful encrypted backup and native restore drill
permissions:
  contents: read
  actions: read
  packages: read
concurrency:
  group: deploy-production
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: production
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          persist-credentials: false
          ref: ${{ inputs.revision }}
      - name: Verify reviewed contract source, exact image and recovery
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node --input-type=module <<'GATE'
          import fs from 'node:fs';import os from 'node:os';import {execFileSync} from 'node:child_process';import {createHash} from 'node:crypto';
          const i=JSON.parse(fs.readFileSync(process.env.GITHUB_EVENT_PATH)).inputs;
          if(!/^BE[0-9]{14}$/.test(i.collection_iban)||BigInt(i.collection_iban.slice(4)+'1114'+i.collection_iban.slice(2,4))%97n!==1n)throw Error('Valid Belgian collection IBAN required');
          console.log('::add-mask::'+i.collection_iban);
          const baseline='096d495e1075f71c524e3ede943f439809a36a98';
          if(process.env.GITHUB_REF!=='refs/heads/main')throw Error('Protected main source required');
          const liveBaseline='7e88fac17285b1c1db74c13fa05fa6c7f7d51dcc';
          if(!/^ghcr\.io\/infojouwdriver-commits\/jd@sha256:[a-f0-9]{64}$/.test(i.image)||!/^[a-f0-9]{40}$/.test(i.revision))throw Error('Invalid immutable release');
          const api=async p=>{const r=await fetch('https://api.github.com/repos/'+process.env.GITHUB_REPOSITORY+p,{headers:{Authorization:'Bearer '+process.env.GH_TOKEN,Accept:'application/vnd.github+json'},signal:AbortSignal.timeout(20000)});if(!r.ok)throw Error('Acceptance unavailable');return r.json();};
          const ancestry=await api('/compare/'+i.revision+'...main');
          if(!['identical','ahead'].includes(ancestry.status))throw Error('Revision must be reachable from main');
          const scope=await api('/compare/'+baseline+'...'+i.revision);
          const allowed=new Set([".github/workflows/publish-bank-qr.yml", "docs/CODE_MAP_AR.md", "graphify-out/GRAPH_REPORT.md", "graphify-out/GRAPH_TREE.html", "graphify-out/SOURCE_INDEX.md", "graphify-out/graph.json", "graphify-out/health.json", "graphify-out/source-manifest.json", "migrations/20261026_invoice_bank_qr.sql", "scripts/apply-release.mjs", "src/lib/manual-invoices.ts", "src/lib/subscription-billing.ts", "src/lib/subscription-document.ts", "src/lib/invoice-bank-payment.ts", "src/lib/invoice-payment-state.ts", "tests/manual-invoices-database.test.mjs", "tests/run-database-stack.mjs", "tests/subscription-pdf.test.mjs", "tests/invoice-bank-payment.test.mjs"]);
          if(scope.status!=='ahead'||!scope.files?.length||scope.files.length>=300||scope.files.some(f=>!allowed.has(f.filename)||!['modified','added'].includes(f.status)))throw Error('Only reviewed invoice bank QR files may differ from the source baseline');
          for(const [id,path] of [[i.release_run,'release-domain-candidate.yml'],[i.backup_run,'backup-foundation.yml']]){
            if(!/^[1-9][0-9]+$/.test(id))throw Error('Verified run required');
            const run=await api('/actions/runs/'+id);
            if(run.status!=='completed'||run.conclusion!=='success'||run.path!=='.github/workflows/'+path)throw Error('Acceptance did not pass');
            if(path==='release-domain-candidate.yml'){
              if(run.head_sha!==i.revision)throw Error('Release revision mismatch');
              const jobs=await api('/actions/runs/'+id+'/jobs?per_page=100');
              for(const name of ['checks / verify','checks / native-database','domain / candidate','publish'])if(!jobs.jobs?.some(j=>j.name===name&&j.conclusion==='success'))throw Error('Full native and browser acceptance required');
            }else{
              const age=Date.now()-Date.parse(run.updated_at);
              if(!Number.isFinite(age)||age<0||age>24*60*60*1000)throw Error('Recent restore drill required');
              fs.appendFileSync(process.env.GITHUB_OUTPUT,'backup_tag='+run.id+'-'+run.run_attempt+'\n');
            }
          }
          if(!/^[1-9][0-9]+$/.test(i.acceptance_run))throw Error('Exact image acceptance required');
          const accepted=await api('/actions/runs/'+i.acceptance_run);
          if(accepted.path!=='.github/workflows/verify-domain-image.yml'||accepted.head_branch!=='main'||accepted.status!=='completed'||accepted.conclusion!=='success')throw Error('Exact image acceptance did not pass');
          const acceptedSource=await api('/compare/'+accepted.head_sha+'...main');if(!['identical','ahead'].includes(acceptedSource.status))throw Error('Unmerged image acceptance source');
          const artifacts=await api('/actions/runs/'+i.acceptance_run+'/artifacts');
          const artifact=artifacts.artifacts?.find(a=>a.name==='jouww-image-acceptance-'+i.acceptance_run&&!a.expired);
          if(!artifact)throw Error('Exact image proof missing');
          const response=await fetch('https://api.github.com/repos/'+process.env.GITHUB_REPOSITORY+'/actions/artifacts/'+artifact.id+'/zip',{headers:{Authorization:'Bearer '+process.env.GH_TOKEN,Accept:'application/vnd.github+json'},signal:AbortSignal.timeout(30000)});
          if(!response.ok)throw Error('Exact image proof unavailable');const bytes=Buffer.from(await response.arrayBuffer());
          if(artifact.digest&&artifact.digest!=='sha256:'+createHash('sha256').update(bytes).digest('hex'))throw Error('Exact image proof integrity mismatch');
          const dir=fs.mkdtempSync(os.tmpdir()+'/driver-image-proof-');
          try{
            fs.writeFileSync(dir+'/proof.zip',bytes,{mode:0o600});
            const proof=JSON.parse(execFileSync('unzip',['-p',dir+'/proof.zip','candidate-native-proof.json'],{encoding:'utf8'}));
            const requiredNativeChecks = [
              "Final PostgreSQL TCP server accepts authenticated SELECT 1 after bootstrap",
              "PostgreSQL has no published host port",
              "Reconstructed schema and full deployment migration sequence applied on native PostgreSQL",
              "Read-only live schema exporter saves native pg_dump tables, functions and RLS without row data",
              "Gateway database login is not superuser and does not bypass RLS or inherit service privileges",
              "PostgREST publishes only a random loopback port",
              "JWT switches real PostgREST to non-superuser service role under RLS",
              "Service role writes and reads business data",
              "Browser role cannot read tables or invoke restored PUBLIC function",
              "Concurrent completion retries create one trip, force server owner and lock completed trip",
              "Subsequent completion retry returns the original record",
              "Browser role cannot invoke completion RPC",
              "Native MFA claim accepts once, rejects replay and browser role",
              "Native shared rate bucket enforces limit and denies browser RPC",
              "Exact immutable candidate image preloaded for native acceptance",
              "Independent core foreign keys and tenant identity validate on native PostgreSQL and reject mismatched driver company",
              "Native lifecycle RPCs enforce browser denial, unique accounts, atomic rollback, credential synchronization and history-preserving deactivation",
              "Standalone startup passes real preflight/readiness as UID10001 with read-only filesystem",
              "Production readiness accepts validated independent schema and refuses an unvalidated core foreign key",
              "Real application phone login validates bcrypt and issues secure cookies with browser role",
              "Cookie session resolves authenticated driver through real database",
              "Candidate app origin accepts host-only sessions and exact legacy origin; marketing origins denied for authenticated GET and POST",
              "Real application completion persists canonical Chiron environment, original offline times, exact owner/vehicle/price and zero coordinates without Chiron",
              "Two application retries return the original completed record without duplication or repricing",
              "Application refuses edits to the locked completed trip",
              "Real database-backed driver authorization denies admin routes and another owner trip",
              "Annual 50 EUR VAT-inclusive registration contract stays unsigned and unbilled until authenticated owner signature; native HTTP retries preserve one signature and cross-tenant isolation",
              "Native company onboarding persists encrypted pending records, blocks both logins until MFA approval, denies browser RPCs and retries without duplication; approval preserves Chiron TEST",
              "Native company pricing saves euro cents and preserves zero fees; invalid values and driver writes are rejected without changing stored rates",
              "Native contracts use canonical company identity, clamp calendar dates, preserve exact cents and prevent changes or deletion of signed documents",
              "Cancelling an unsigned draft retains the original document and record rather than deleting it",
              "Real administrator MFA session creates and lists a company through production handlers and native PostgreSQL",
              "Creating a company with credentials atomically provisions its isolated login identity; company login normalizes email and cannot enter admin routes",
              "Administrator trip overview includes all owners and selected company; driver remains scoped to own trips",
              "Real driver composing, sent-message inbox and management replies work; unrelated driver threads reject both reads and replies",
              "Reviewed Chiron routes replace disabled stubs, accept UI trip identifiers, encrypt credentials, reject wrong environments and preserve driver authorization",
              "Actual PostgreSQL and HTTP billing use exact cents, immutable issuance, idempotent payment, owner read-only statements and PDF; archive preserves history and restore does not resume billing",
              "Native conditional event claim permits only one concurrent sender without altering a locked trip price",
              "Self password change reauthenticates current password, saves the canonical hash and immediately invalidates the existing session",
              "Logout revokes existing access token against real PostgreSQL and clears cookies",
              "Actual backup.sh produces a private age-encrypted custom-format dump with no plaintext dump file",
              "Failed pg_dump leaves no published backup or temporary plaintext file",
              "Encrypted backup restores in a separate network-isolated PostgreSQL container with matching all-table hashes, sequences, constraints, functions, RLS and browser/service access",
              "Wrong decryption key and corrupted encrypted backup are rejected",
              "Actual app fails closed with 503 when real PostgREST rate storage is unavailable",
              "Native welcome publication permits anonymous presentation only, requires MFA admin, rejects stale versions and denies browser writes",
              "Email contract links permit anonymous review and explicit signature only for the active invited owner and exact document; immutable evidence and HTTP retries preserve one simple signature without invoice delivery"
            ];
            const completedNativeChecks=new Set(Array.isArray(proof.checks)?proof.checks:[]);
            if(proof.candidateImage!==i.image||!Array.isArray(proof.checks)||proof.passed!==proof.checks.length||completedNativeChecks.size!==proof.checks.length||requiredNativeChecks.some(check=>!completedNativeChecks.has(check)))throw Error('Exact image/origin acceptance missing');
          }finally{fs.rmSync(dir,{recursive:true,force:true});}
          fs.appendFileSync(process.env.GITHUB_OUTPUT,'baseline='+liveBaseline+'\n');
          console.log('Reviewed contract signing, exact jouww image and recent recovery verified.');
          GATE
      - name: Apply bank instruction snapshots and replace the verified image
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          REGISTRY_TOKEN: ${{ github.token }}
          COLLECTION_IBAN: ${{ inputs.collection_iban }}
          IMAGE: ${{ inputs.image }}
          REVISION: ${{ inputs.revision }}
          BASELINE: ${{ steps.gate.outputs.baseline }}
          BACKUP_TAG: ${{ steps.gate.outputs.backup_tag }}
        run: |
          set -euo pipefail
          umask 077
          [[ "$DEPLOY_HOST" =~ ^[a-zA-Z0-9][a-zA-Z0-9.-]*$ ]]
          [[ "$DEPLOY_USER" =~ ^[a-z_][a-z0-9_-]*$ ]]
          [[ "$IMAGE" =~ ^ghcr.io/infojouwdriver-commits/jd@sha256:[a-f0-9]{64}$ ]]
          [[ "$REVISION" =~ ^[a-f0-9]{40}$ && "$BASELINE" =~ ^[a-f0-9]{40}$ && "$BACKUP_TAG" =~ ^[0-9]+-[0-9]+$ ]]
          [[ "$COLLECTION_IBAN" =~ ^BE[0-9]{14}$ ]]
          test -n "$DEPLOY_KEY" && test -n "$KNOWN_HOSTS"
          keydir=$(mktemp -d)
          trap 'rm -rf "$keydir"' EXIT
          printf '%s\n' "$DEPLOY_KEY" > "$keydir/key"
          printf '%s\n' "$KNOWN_HOSTS" > "$keydir/known_hosts"
          args=(-i "$keydir/key" -o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$keydir/known_hosts" -o ConnectTimeout=20)
          printf '%s\n' "$REGISTRY_TOKEN" | ssh "${args[@]}" "$DEPLOY_USER@$DEPLOY_HOST" "set -eu; umask 077; read -r token; config=\$(mktemp -d); export DOCKER_CONFIG=\"\$config\"; trap 'rm -rf \"\$config\"' EXIT; printf '%s' \"\$token\" | docker login ghcr.io -u infojouwdriver-commits --password-stdin >/dev/null 2>&1; unset token; docker pull '$IMAGE'"
          migration_sha=$(sha256sum migrations/20261026_invoice_bank_qr.sql | awk '{print $1}')
          [[ "$migration_sha" =~ ^[a-f0-9]{64}$ ]]
          ssh "${args[@]}" "$DEPLOY_USER@$DEPLOY_HOST" "mkdir -p /srv/jouw-driver/releases/$REVISION"
          scp "${args[@]}" migrations/20261026_invoice_bank_qr.sql "$DEPLOY_USER@$DEPLOY_HOST:/srv/jouw-driver/releases/$REVISION/invoice-bank-qr.sql"
          ssh "${args[@]}" "$DEPLOY_USER@$DEPLOY_HOST" "bash -s -- '$IMAGE' '$REVISION' '$BASELINE' '$BACKUP_TAG' '$migration_sha' '$COLLECTION_IBAN'" <<'REMOTE'
          set -euo pipefail
          umask 077
          export STRIPE_IMAGE=$1 STRIPE_REVISION=$2 STRIPE_BASELINE=$3 STRIPE_BACKUP=$4 STRIPE_MIGRATION_SHA=$5 COLLECTION_IBAN=$6
          cd /srv/jouw-driver/foundation
          test "$(grep -c '^APP_ORIGIN=https://app.jouww.com$' .app-staging.env)" = 1
          test ! -e /srv/jouw-driver/.env
          test -s "/srv/jouw-driver/backups/foundation-$STRIPE_BACKUP.tar.age"
          test "$(sha256sum "/srv/jouw-driver/backups/foundation-$STRIPE_BACKUP.tar.age" | awk '{print $1}')" = "$(cat "/srv/jouw-driver/backups/foundation-$STRIPE_BACKUP.sha256")"
          test "$(docker inspect --format '{{index .Config.Labels "org.opencontainers.image.revision"}}' "$STRIPE_IMAGE")" = "$STRIPE_REVISION"
          test "$(docker inspect --format '{{index .Config.Labels "com.jouwdriver.portal-origin"}}' "$STRIPE_IMAGE")" = https://app.jouww.com
          mkdir /srv/jouw-driver/.deployment-lock
          work=''
          changed=false
          updated=false
          cleanup(){
            status=$?
            trap - EXIT
            if test "$changed" = true && test "$updated" != true; then
              cat "$work/private-app.yaml" > private-app.yaml
              cat "$work/runtime-mode.json" > runtime-mode.json
              cat "$work/release.json" > /srv/jouw-driver/release.json
              docker compose --env-file .app-staging.env --project-name jouw-driver --file private-app.yaml up -d --no-deps --wait --wait-timeout 180 app </dev/null || printf 'Previous application requires operator recovery\n' >&2
            fi
            test -z "$work" || rm -rf "$work"
            rmdir /srv/jouw-driver/.deployment-lock
            exit "$status"
          }
          trap cleanup EXIT
          node --input-type=module <<'BEFORE'
          import fs from 'node:fs';
          const s=JSON.parse(fs.readFileSync('runtime-mode.json')),r=JSON.parse(fs.readFileSync('/srv/jouw-driver/release.json'));
          console.log(JSON.stringify({live_revision:s.revision,live_image:s.image}));
          if(s.mode!=='public'||s.image!==r.image||s.revision!==r.revision||s.revision!==process.env.STRIPE_BASELINE)throw Error('Live release differs from the reviewed contract update baseline');
          if(s.image!=='ghcr.io/infojouwdriver-commits/jd@sha256:c8db833eb7ea13850873f4c6048841423e2a992d7afc3ee2ee59e00eaba338df')throw Error('Live image differs from the reviewed invoice workspace release');
          if(fs.statSync('/srv/jouw-driver/backups/foundation-'+process.env.STRIPE_BACKUP+'.tar.age').mtimeMs<Date.parse(s.deployedAt))throw Error('Backup must cover the live release');
          const c=fs.readFileSync('private-app.yaml','utf8'),images=c.match(/ghcr\.io\/infojouwdriver-commits\/jd@sha256:[a-f0-9]{64}/g);
          if(images?.length!==1||images[0]!==s.image)throw Error('Live application image mismatch');
          BEFORE
          work=$(mktemp -d .contract-signing-update.XXXXXX)
          cp private-app.yaml runtime-mode.json "$work/"
          cp /srv/jouw-driver/release.json "$work/release.json"
          sha256sum .app-staging.env .database.env Caddyfile compose.yaml > "$work/preserved.sha256"
          node --env-file=.database.env --input-type=module <<'MIGRATE'
          import fs from 'node:fs';import {spawnSync} from 'node:child_process';import {createHash} from 'node:crypto';
          const e=process.env;
          if(e.POSTGREST_SCHEMA!=='public'||e.SCHEMA_ADMIN_USER!=='jouw_service'||e.POSTGRES_DB!=='jouw_driver')throw Error('Unexpected database scope');
          const raw=fs.readFileSync('/srv/jouw-driver/releases/'+e.STRIPE_REVISION+'/invoice-bank-qr.sql');
          if(createHash('sha256').update(raw).digest('hex')!==e.STRIPE_MIGRATION_SHA)throw Error('Contract migration identity mismatch');
          const sql=raw.toString('utf8').replaceAll(':"schema"','"public"').replaceAll(':"admin_role"','"jouw_service"').replaceAll(':"user_role"','"jouw_app_user"');
          const args=['compose','--env-file','.database.env','--project-name','jouw-driver','--file','compose.yaml','exec','-T','db','psql','-U','postgres','-d','jouw_driver','-v','ON_ERROR_STOP=1','-Atq'];
          const before=spawnSync('docker',args,{input:"SELECT public.independent_schema_ready() AND NOT EXISTS(SELECT FROM unnest(ARRAY['jouw_app_user','jouw_service','jouw_gateway']) r(role) WHERE has_schema_privilege(role,'jouw_driver_archive_20261009','USAGE'));",encoding:'utf8'});
          if(before.status!==0||before.stdout.trim()!=='t')throw Error('Operational schema or archive isolation is not accepted');
          const applied=spawnSync('docker',args,{input:sql+"\nNOTIFY pgrst, 'reload schema';\n",encoding:'utf8'});
          if(applied.status!==0)throw Error('Invoice bank snapshot migration rejected; old application retained');
          const iban=e.COLLECTION_IBAN;
          if(!/^BE[0-9]{14}$/.test(iban)||BigInt(iban.slice(4)+'1114'+iban.slice(2,4))%97n!==1n)throw Error('Invalid collection IBAN');
          const configured=spawnSync('docker',args,{input:`BEGIN; SET LOCAL lock_timeout='5s'; DO $$ DECLARE issuer public.companies; settings public.subscription_billing_settings; BEGIN SELECT * INTO settings FROM public.subscription_billing_settings WHERE id=1 FOR UPDATE; SELECT * INTO issuer FROM public.companies WHERE id=settings.issuer_company_id AND archived_at IS NULL AND NOT is_test; IF issuer.id IS NULL OR coalesce(length(trim(issuer.name)),0) NOT BETWEEN 1 AND 70 OR position(chr(10) in issuer.name)>0 OR position(chr(13) in issuer.name)>0 THEN RAISE EXCEPTION 'Existing real legal issuer required';END IF; IF settings.collection_iban IS NOT NULL AND (settings.collection_iban IS DISTINCT FROM '${iban}' OR settings.collection_issuer_id IS DISTINCT FROM issuer.id) THEN RAISE EXCEPTION 'Existing bank instructions require review';END IF; UPDATE public.subscription_billing_settings SET collection_iban='${iban}',collection_issuer_id=issuer.id,updated_at=clock_timestamp() WHERE id=1; END $$; COMMIT;`,encoding:'utf8'});
          if(configured.status!==0)throw Error('Bank instruction configuration rejected; inspect privately on host');
          const check=spawnSync('docker',args,{input:"SELECT EXISTS(SELECT FROM information_schema.columns WHERE table_schema='public' AND table_name='manual_invoices' AND column_name='bank_payment') AND EXISTS(SELECT FROM information_schema.columns WHERE table_schema='public' AND table_name='subscription_documents' AND column_name='bank_payment') AND NOT has_function_privilege('jouw_app_user','public.security_snapshot_invoice_bank()','EXECUTE') AND has_function_privilege('jouw_service','public.security_snapshot_invoice_bank()','EXECUTE');",encoding:'utf8'});
          if(check.status!==0||check.stdout.trim()!=='t')throw Error('Invoice snapshots or browser isolation failed');
          console.log('Invoice bank instructions configured; existing financial records preserved.');
          MIGRATE
          docker compose --env-file .app-staging.env --project-name jouw-driver --file private-app.yaml restart postgrest </dev/null
          changed=true
          node --input-type=module <<'IMAGE'
          import fs from 'node:fs';
          const c=fs.readFileSync('private-app.yaml','utf8');
          fs.writeFileSync('private-app.yaml',c.replace(/ghcr\.io\/infojouwdriver-commits\/jd@sha256:[a-f0-9]{64}/,process.env.STRIPE_IMAGE),{mode:0o600});
          IMAGE
          docker compose --env-file .app-staging.env --project-name jouw-driver --file private-app.yaml up -d --no-deps --wait --wait-timeout 180 app </dev/null
          app=$(docker compose --env-file .app-staging.env --project-name jouw-driver --file private-app.yaml ps -q app)
          test "$(docker inspect --format '{{.Config.Image}}' "$app")" = "$STRIPE_IMAGE"
          test "$(docker inspect --format '{{.HostConfig.ReadonlyRootfs}}' "$app")" = true
          test "$(docker inspect --format '{{.State.Health.Status}}' "$app")" = healthy
          docker exec "$app" node scripts/preflight.mjs
          docker exec "$app" node scripts/database-readiness.mjs
          sha256sum --status --check "$work/preserved.sha256"
          node --input-type=module <<'ACCEPT'
          const base='https://app.jouww.com';
          for(const path of ['/','/login','/driver-login','/register-company','/privacy-policy']){
            const r=await fetch(base+path,{redirect:'error',signal:AbortSignal.timeout(20000)});
            if(r.status!==200||!r.headers.get('content-security-policy')?.includes("default-src 'self'"))throw Error('HTTPS page or security policy failed');
            if(path==='/'&&!(await r.text()).includes('pm-orbital'))throw Error('Marketing design absent');
          }
          for(const [path,status,headers] of [['/next_api/drivers/shifts/pdf?id=11111111-1111-4111-8111-111111111111',401,{}],['/next_api/drivers/shifts',401,{}],['/next_api/manual-invoices',401,{}],['/next_api/stripe-billing?company_id=1',401,{}],['/next_api/auth/user',401,{}],['/next_api/trips',401,{}],['/next_api/companies',401,{}],['/next_api/auth/user',403,{Origin:'https://untrusted.example'}],['/admin-setup',404,{}]]){
            if((await fetch(base+path,{headers,redirect:'error',signal:AbortSignal.timeout(15000)})).status!==status)throw Error('Access guard failed');
          }
          for(const origin of ['https://jouww.com','https://www.jouww.com'])if((await fetch(base+'/next_api/auth/user',{headers:{Origin:origin},redirect:'error',signal:AbortSignal.timeout(15000)})).status!==403)throw Error('Marketing origin accepted');
          if((await fetch(base+'/next_api/auth/user',{headers:{Origin:'https://jouw-driver.duckdns.org'},redirect:'error',signal:AbortSignal.timeout(15000)})).status!==401)throw Error('Legacy client origin rejected');
          if((await fetch(base+'/documents/receipts/invalid',{redirect:'error',signal:AbortSignal.timeout(15000)})).status!==404)throw Error('Invalid document capability accepted');
          for(const host of ['https://jouww.com','https://www.jouww.com','https://jouw-driver.duckdns.org'])if((await fetch(host+'/privacy-policy',{redirect:'error',signal:AbortSignal.timeout(15000)})).status!==200)throw Error('Preserved HTTPS host failed');
          const welcome=await fetch(base+'/next_api/app-experience',{redirect:'error',signal:AbortSignal.timeout(15000)});
          const config=await welcome.json();
          if(welcome.status!==200||config.success!==true||Object.keys(config.data).sort().join(',')!=='enabled,motion,poster_data,subtitle,title,version')throw Error('Public welcome presentation failed');
          if((await fetch(base+'/next_api/app-experience',{method:'PUT',headers:{Origin:base,'Content-Type':'application/json'},body:JSON.stringify(config.data),redirect:'error',signal:AbortSignal.timeout(15000)})).status!==401)throw Error('Anonymous welcome publication allowed');
          for(const path of ['/next_api/contracts/sign','/next_api/contracts/verify-token']){
            const get=await fetch(base+path,{signal:AbortSignal.timeout(15000)});if(get.status!==405)throw Error('Legacy query token accepted');
            const invalid=await fetch(base+path,{method:'POST',headers:{Origin:base,'Content-Type':'application/json'},body:'{}',signal:AbortSignal.timeout(15000)});if(invalid.status!==400)throw Error('Contract signature field guard failed');
          }
          const stripeHook=await fetch(base+'/next_api/webhooks/stripe',{method:'POST',headers:{'Content-Type':'application/json'},body:'{}',signal:AbortSignal.timeout(15000)});if(stripeHook.status!==400)throw Error('Unsigned payment notification accepted');
          console.log('Contract signature guards, welcome, QR access, exact origin and HTTPS hosts verified.');
          ACCEPT
          node --input-type=module <<'STATE'
          import fs from 'node:fs';
