name: Publish verified admin company onboarding
on:
  push:
    branches: [main]
    paths: ['.github/workflows/publish-admin-company-onboarding.yml']
  workflow_dispatch:
    inputs:
      image:
        description: Accepted immutable GHCR image digest
        type: string
        required: true
      acceptance_run:
        description: Successful Verify immutable jouww image in isolation run
        type: string
        required: true
      backup_run:
        description: Successful recent encrypted foundation restore drill
        type: string
        required: true
permissions:
  contents: read
  actions: read
  pull-requests: read
  packages: read
concurrency:
  group: deploy-production
  cancel-in-progress: false
env:
  CANDIDATE_REVISION: 3fd05774ccd7c9cd47289c6b46fbb85d3245938d
  CANDIDATE_RUN: '44955466973'
jobs:
  publish:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.event.head_commit.message, 'Deploy verified admin company onboarding to production')
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    environment: production
    steps:
      - name: Verify merged source, exact candidate and recent restore
        id: gates
        env:
          GH_TOKEN: ${{ github.token }}
          IMAGE: ${{ github.event_name == 'push' && 'ghcr.io/infojouwdriver-commits/jd@sha256:e775872886f1eb468ebe08cecba4c47f7116ca169d1217754cde65542978724a' || inputs.image }}
          ACCEPTANCE_RUN: ${{ github.event_name == 'push' && '44956800326' || inputs.acceptance_run }}
          BACKUP_RUN: ${{ github.event_name == 'push' && '44884391662' || inputs.backup_run }}
        run: |
          node --input-type=module <<'GATE'
          import fs from 'node:fs';
          import os from 'node:os';
          import {execFileSync} from 'node:child_process';
          const {CANDIDATE_REVISION:revision,CANDIDATE_RUN,IMAGE,ACCEPTANCE_RUN,BACKUP_RUN}=process.env;
          if(process.env.GITHUB_REF!=='refs/heads/main'||!/^ghcr\.io\/infojouwdriver-commits\/jd@sha256:[a-f0-9]{64}$/.test(IMAGE))throw Error('Protected main and the immutable image are required');
          const headers={Accept:'application/vnd.github+json',Authorization:'Bearer '+process.env.GH_TOKEN};
          const api=async path=>{const r=await fetch('https://api.github.com/repos/'+process.env.GITHUB_REPOSITORY+path,{headers,signal:AbortSignal.timeout(20000)});if(!r.ok)throw Error('Cannot verify release evidence');return r.json();};
          const pr=await api('/pulls/155');
          if(!pr.merged||pr.base.ref!=='main')throw Error('Company onboarding pull request must be merged');
          const merged=await api('/compare/'+revision+'...'+pr.merge_commit_sha);
          if(!['identical','ahead'].includes(merged.status)||merged.files?.some(f=>f.filename!=='.github/workflows/publish-admin-company-onboarding.yml'))
            throw Error('Merged production source differs from the accepted candidate');
          let backup;
          for(const [id,path] of [[CANDIDATE_RUN,'release-domain-candidate.yml'],[ACCEPTANCE_RUN,'verify-domain-image.yml'],[BACKUP_RUN,'backup-foundation.yml']]){
            if(!/^[1-9][0-9]+$/.test(id))throw Error('Verified run ID required');
            const run=await api('/actions/runs/'+id);
            if(run.path!=='.github/workflows/'+path||run.status!=='completed'||run.conclusion!=='success')throw Error('Required release evidence did not pass');
            if(id===CANDIDATE_RUN&&run.head_sha!==revision)throw Error('Candidate revision mismatch');
            if(id===ACCEPTANCE_RUN&&run.head_branch!=='main')throw Error('Image verification must run from main');
            if(id===BACKUP_RUN){
              const age=Date.now()-Date.parse(run.updated_at);
              if(!Number.isFinite(age)||age<0||age>86400000)throw Error('Restore drill must be recent');
              backup=run.id+'-'+run.run_attempt;
            }
          }
          const items=await api('/actions/runs/'+ACCEPTANCE_RUN+'/artifacts');
          const proof=items.artifacts.find(a=>a.name==='jouww-image-acceptance-'+ACCEPTANCE_RUN&&!a.expired);
          if(!proof)throw Error('Exact image proof unavailable');
          const response=await fetch('https://api.github.com/repos/'+process.env.GITHUB_REPOSITORY+'/actions/artifacts/'+proof.id+'/zip',{headers,signal:AbortSignal.timeout(30000)});
          if(!response.ok)throw Error('Unable to download image proof');
          const dir=fs.mkdtempSync(os.tmpdir()+'/company-onboarding-proof-');
          try{
            fs.writeFileSync(dir+'/proof.zip',Buffer.from(await response.arrayBuffer()),{mode:0o600});
            const data=JSON.parse(execFileSync('unzip',['-p',dir+'/proof.zip','candidate-native-proof.json'],{encoding:'utf8'}));
            if(data.candidateImage!==IMAGE||!Array.isArray(data.checks)||data.passed!==data.checks.length||!data.checks.includes('Reconstructed schema and full deployment migration sequence applied on native PostgreSQL'))throw Error('Exact image and native migrations must pass');
          }finally{fs.rmSync(dir,{recursive:true,force:true});}
          fs.appendFileSync(process.env.GITHUB_OUTPUT,'backup='+backup+'\n');
          GATE
      - name: Check the actual live revision against the approved deployment scope
        id: scope
        env:
          GH_TOKEN: ${{ github.token }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          umask 077
          [[ "$DEPLOY_HOST" =~ ^[a-zA-Z0-9][a-zA-Z0-9.-]*$ && "$DEPLOY_USER" =~ ^[a-z_][a-z0-9_-]*$ ]]
          test -n "$DEPLOY_KEY" && test -n "$KNOWN_HOSTS"
          keydir=$(mktemp -d)
          trap 'rm -rf "$keydir"' EXIT
          printf '%s\n' "$DEPLOY_KEY" > "$keydir/key"
          printf '%s\n' "$KNOWN_HOSTS" > "$keydir/known_hosts"
          baseline=$(ssh -i "$keydir/key" -o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$keydir/known_hosts" -o ConnectTimeout=20 "$DEPLOY_USER@$DEPLOY_HOST" 'node -p "require(\"/srv/jouw-driver/release.json\").revision"' </dev/null)
          [[ "$baseline" =~ ^[a-f0-9]{40}$ ]]
          printf 'Live revision %s\n' "$baseline"
          BASELINE="$baseline" node --input-type=module <<'SCOPE'
          const headers={Accept:'application/vnd.github+json',Authorization:'Bearer '+process.env.GH_TOKEN};
          const r=await fetch('https://api.github.com/repos/'+process.env.GITHUB_REPOSITORY+'/compare/'+process.env.BASELINE+'...'+process.env.CANDIDATE_REVISION,{headers,signal:AbortSignal.timeout(20000)});
          if(!r.ok)throw Error('Live-to-candidate comparison unavailable');
          const comparison=await r.json();
          const files=comparison.files??[];
          const allowed=new Set([
            '.env.example',
            '.github/workflows/publish-company-email-sync.yml',
            'deploy/compose.yaml',
            'docs/CODE_MAP_AR.md',
            'migrations/20261121_admin_company_onboarding.sql',
            'package.json',
            'pnpm-lock.yaml',
            'scripts/apply-release.mjs',
            'src/app/admin/companies/page.tsx',
            'src/app/next_api/companies/cbe/route.ts',
            'src/app/next_api/companies/onboarding/route.ts',
            'src/components/operations/AdminCompanyRegistration.tsx',
            'src/lib/cbe-public-search.ts',
            'src/lib/company-account.ts',
            'src/lib/driver-account.ts',
            'tests/admin-company-onboarding-database.test.mjs',
            'tests/cbe-public-search.test.mjs',
            'tests/run-customer-ui.mjs',
            'tests/run-database-stack.mjs',
            'tests/run-portal-ui.mjs',
          ]);
          const excluded=files.filter(f=>!['added','modified'].includes(f.status)||(!allowed.has(f.filename)&&!f.filename.startsWith('graphify-out/')));
          if(comparison.status!=='ahead'||files.length>=300||!files.some(f=>f.filename==='migrations/20261121_admin_company_onboarding.sql')||excluded.length)throw Error('Unreviewed live delta: '+excluded.map(f=>f.filename).join(', '));
          SCOPE
          printf 'baseline=%s\n' "$baseline" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          ref: ${{ env.CANDIDATE_REVISION }}
          persist-credentials: false
      - name: Deploy the accepted image and apply the company onboarding migration
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          REGISTRY_TOKEN: ${{ github.token }}
          IMAGE: ${{ github.event_name == 'push' && 'ghcr.io/infojouwdriver-commits/jd@sha256:e775872886f1eb468ebe08cecba4c47f7116ca169d1217754cde65542978724a' || inputs.image }}
          REVISION: ${{ env.CANDIDATE_REVISION }}
          BASELINE: ${{ steps.scope.outputs.baseline }}
          BACKUP_TAG: ${{ steps.gates.outputs.backup }}
        run: |
          set -euo pipefail
          umask 077
          [[ "$DEPLOY_HOST" =~ ^[a-zA-Z0-9][a-zA-Z0-9.-]*$ ]]
          [[ "$DEPLOY_USER" =~ ^[a-z_][a-z0-9_-]*$ ]]
          [[ "$IMAGE" =~ ^ghcr.io/infojouwdriver-commits/jd@sha256:[a-f0-9]{64}$ ]]
          [[ "$REVISION" =~ ^[a-f0-9]{40}$ && "$BASELINE" =~ ^[a-f0-9]{40}$ && "$BACKUP_TAG" =~ ^[0-9]+-[0-9]+$ ]]
          test -n "$DEPLOY_KEY" && test -n "$KNOWN_HOSTS"
          keydir=$(mktemp -d)
          trap 'rm -rf "$keydir"' EXIT
          printf '%s\n' "$DEPLOY_KEY" > "$keydir/key"
          printf '%s\n' "$KNOWN_HOSTS" > "$keydir/known_hosts"
          args=(-i "$keydir/key" -o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$keydir/known_hosts" -o ConnectTimeout=20)
          printf '%s\n' "$REGISTRY_TOKEN" | ssh "${args[@]}" "$DEPLOY_USER@$DEPLOY_HOST" "set -eu; umask 077; read -r token; config=\$(mktemp -d); export DOCKER_CONFIG=\"\$config\"; trap 'rm -rf \"\$config\"' EXIT; printf '%s' \"\$token\" | docker login ghcr.io -u infojouwdriver-commits --password-stdin >/dev/null 2>&1; unset token; docker pull '$IMAGE'"
          migration=migrations/20261121_admin_company_onboarding.sql
          migration_sha=$(sha256sum "$migration" | cut -d' ' -f1)
          ssh "${args[@]}" "$DEPLOY_USER@$DEPLOY_HOST" "umask 077; mkdir -p /srv/jouw-driver/releases/$REVISION"
          scp "${args[@]}" "$migration" "$DEPLOY_USER@$DEPLOY_HOST:/srv/jouw-driver/releases/$REVISION/"
          ssh "${args[@]}" "$DEPLOY_USER@$DEPLOY_HOST" "bash -s -- '$IMAGE' '$REVISION' '$BASELINE' '$BACKUP_TAG' '$migration_sha'" <<'REMOTE'
          set -euo pipefail
          umask 077
          export ONBOARDING_RELEASE_IMAGE=$1 ONBOARDING_RELEASE_REVISION=$2 ONBOARDING_RELEASE_BASELINE=$3 ONBOARDING_RELEASE_BACKUP=$4 ONBOARDING_RELEASE_MIGRATION_SHA=$5
          cd /srv/jouw-driver/foundation
          test "$(grep -c '^APP_ORIGIN=https://app.jouww.com$' .app-staging.env)" = 1
          test ! -e /srv/jouw-driver/.env
          test -s "/srv/jouw-driver/backups/foundation-$ONBOARDING_RELEASE_BACKUP.tar.age"
          test "$(sha256sum "/srv/jouw-driver/backups/foundation-$ONBOARDING_RELEASE_BACKUP.tar.age" | awk '{print $1}')" = "$(cat "/srv/jouw-driver/backups/foundation-$ONBOARDING_RELEASE_BACKUP.sha256")"
          test "$(docker inspect --format '{{index .Config.Labels "org.opencontainers.image.revision"}}' "$ONBOARDING_RELEASE_IMAGE")" = "$ONBOARDING_RELEASE_REVISION"
          test "$(docker inspect --format '{{index .Config.Labels "com.jouwdriver.portal-origin"}}' "$ONBOARDING_RELEASE_IMAGE")" = https://app.jouww.com
          mkdir /srv/jouw-driver/.deployment-lock
          work=''
          changed=false
          updated=false
          cleanup(){
            status=$?
            trap - EXIT
            if test "$changed" = true && test "$updated" != true; then
              cat "$work/private-app.yaml" > private-app.yaml
              cat "$work/runtime-mode.json" > runtime-mode.json
              cat "$work/release.json" > /srv/jouw-driver/release.json
              docker compose --env-file .app-staging.env --project-name jouw-driver --file private-app.yaml up -d --no-deps --wait --wait-timeout 180 app </dev/null || printf 'Previous application requires operator recovery\n' >&2
            fi
            test -z "$work" || rm -rf "$work"
            rmdir /srv/jouw-driver/.deployment-lock
            exit "$status"
          }
          trap cleanup EXIT
          node --input-type=module <<'BEFORE'
          import fs from 'node:fs';
          const s=JSON.parse(fs.readFileSync('runtime-mode.json')),r=JSON.parse(fs.readFileSync('/srv/jouw-driver/release.json'));
          if(s.mode!=='public'||s.image!==r.image||s.revision!==r.revision||s.revision!==process.env.ONBOARDING_RELEASE_BASELINE)throw Error('The live revision changed after the scope check');
          if(fs.statSync('/srv/jouw-driver/backups/foundation-'+process.env.ONBOARDING_RELEASE_BACKUP+'.tar.age').mtimeMs<Date.parse(s.deployedAt))throw Error('Backup must cover the live release');
          const c=fs.readFileSync('private-app.yaml','utf8'),images=c.match(/ghcr\.io\/infojouwdriver-commits\/jd@sha256:[a-f0-9]{64}/g);
          if(images?.length!==1||images[0]!==s.image)throw Error('Live application image mismatch');
          BEFORE
          work=$(mktemp -d .company-onboarding-update.XXXXXX)
          cp private-app.yaml runtime-mode.json "$work/"
          cp /srv/jouw-driver/release.json "$work/release.json"
          sha256sum .app-staging.env .database.env Caddyfile compose.yaml > "$work/preserved.sha256"
          node --env-file=.database.env --input-type=module <<'MIGRATE'
          import fs from 'node:fs';
          import {spawnSync} from 'node:child_process';
          import {createHash} from 'node:crypto';
          const env=process.env;
          if(env.POSTGREST_SCHEMA!=='public'||env.POSTGRES_DB!=='jouw_driver')throw Error('Unexpected database scope');
          const raw=fs.readFileSync('/srv/jouw-driver/releases/'+env.ONBOARDING_RELEASE_REVISION+'/20261121_admin_company_onboarding.sql');
          if(createHash('sha256').update(raw).digest('hex')!==env.ONBOARDING_RELEASE_MIGRATION_SHA)throw Error('Migration identity mismatch');
          const source=raw.toString('utf8');
          if(!/COMMIT;\s*$/.test(source))throw Error('Transactional company onboarding migration required');
          if(!/^[a-z_][a-z0-9_]{0,62}$/.test(env.SCHEMA_ADMIN_USER||'')||!/^[a-z_][a-z0-9_]{0,62}$/.test(env.SCHEMA_USER||''))throw Error('Unexpected database roles');
          const verify=`DO $$ BEGIN
            IF NOT has_function_privilege('${env.SCHEMA_ADMIN_USER}', 'public.security_onboard_admin_company(bigint,uuid,jsonb,jsonb,jsonb,jsonb,jsonb)', 'EXECUTE')
               OR has_function_privilege('${env.SCHEMA_USER}', 'public.security_onboard_admin_company(bigint,uuid,jsonb,jsonb,jsonb,jsonb,jsonb)', 'EXECUTE')
               OR NOT has_table_privilege('${env.SCHEMA_ADMIN_USER}', 'public.admin_company_onboarding', 'INSERT')
               OR has_table_privilege('${env.SCHEMA_USER}', 'public.admin_company_onboarding', 'SELECT')
            THEN RAISE EXCEPTION 'Company onboarding migration privileges incorrect'; END IF;
          END $$; NOTIFY pgrst, 'reload schema';`;
          const sql=source.replace(/^BEGIN;/,'BEGIN;\nSET LOCAL lock_timeout=\'5s\';').replaceAll(':"schema"','"public"').replaceAll(':"admin_role"', '"'+env.SCHEMA_ADMIN_USER+'"').replaceAll(':"user_role"', '"'+env.SCHEMA_USER+'"').replace(/COMMIT;\s*$/,()=>verify+'\nCOMMIT;\n');
          const args=['compose','--env-file','.database.env','--project-name','jouw-driver','--file','compose.yaml','exec','-T','db','psql','-U','postgres','-d','jouw_driver','-v','ON_ERROR_STOP=1','-v','VERBOSITY=verbose','-Atq'];
          const processResult=spawnSync('docker',args,{input:sql,encoding:'utf8',timeout:30000});
          if(processResult.status!==0){
            const state=/ERROR:\s+([0-9A-Z]{5}):/.exec(processResult.stderr||'')?.[1];
            throw Error('Company onboarding migration failed'+(state?' (SQLSTATE '+state+')':''));
          }
          console.log('Company onboarding migration and role grants verified.');
          MIGRATE
          changed=true
          node --input-type=module <<'IMAGE'
          import fs from 'node:fs';
          const c=fs.readFileSync('private-app.yaml','utf8');
          fs.writeFileSync('private-app.yaml',c.replace(/ghcr\.io\/infojouwdriver-commits\/jd@sha256:[a-f0-9]{64}/,process.env.ONBOARDING_RELEASE_IMAGE),{mode:0o600});
          IMAGE
          docker compose --env-file .app-staging.env --project-name jouw-driver --file private-app.yaml up -d --no-deps --wait --wait-timeout 180 app </dev/null
          app=$(docker compose --env-file .app-staging.env --project-name jouw-driver --file private-app.yaml ps -q app)
          test "$(docker inspect --format '{{.Config.Image}}' "$app")" = "$ONBOARDING_RELEASE_IMAGE"
          test "$(docker inspect --format '{{.HostConfig.ReadonlyRootfs}}' "$app")" = true
          test "$(docker inspect --format '{{.State.Health.Status}}' "$app")" = healthy
          docker exec "$app" node scripts/preflight.mjs
          docker exec "$app" node scripts/database-readiness.mjs
          sha256sum --status --check "$work/preserved.sha256"
          node --input-type=module <<'ACCEPT'
          const base='https://app.jouww.com';
          for(const path of ['/','/login','/driver-login','/register-company','/privacy-policy']){
            const r=await fetch(base+path,{redirect:'error',signal:AbortSignal.timeout(20000)});
            if(r.status!==200||!r.headers.get('content-security-policy')?.includes("default-src 'self'"))throw Error('HTTPS page or security policy failed');
            if(path==='/'){
              const html=await r.text();
              if(!html.includes('id="driver-app-downloads"')||!html.includes('releases/download/android-direct/jouw-driver.apk'))throw Error('Verified app download section absent');
            }
          }
          for(const [path,status,headers] of [['/next_api/drivers/shifts/pdf?id=11111111-1111-4111-8111-111111111111',401,{}],['/next_api/drivers/shifts',401,{}],['/next_api/drivers/shifts?startReading=1',401,{}],['/next_api/auth/user',401,{}],['/next_api/trips',401,{}],['/next_api/companies',401,{}],['/next_api/auth/user',403,{Origin:'https://untrusted.example'}],['/admin-setup',404,{}]]){
            if((await fetch(base+path,{headers,redirect:'error',signal:AbortSignal.timeout(15000)})).status!==status)throw Error('Access guard failed');
          }
          for(const path of ['/next_api/companies/onboarding','/next_api/companies/cbe']){
            const r=await fetch(base+path,{method:'POST',headers:{Origin:base,'Content-Type':'application/json'},body:'{}',redirect:'error',signal:AbortSignal.timeout(15000)});
            if(r.status!==401)throw Error('Onboarding endpoint authentication or routing failed');
          }
          for(const origin of ['https://jouww.com','https://www.jouww.com'])if((await fetch(base+'/next_api/auth/user',{headers:{Origin:origin},redirect:'error',signal:AbortSignal.timeout(15000)})).status!==403)throw Error('Marketing origin accepted');
          if((await fetch(base+'/next_api/auth/user',{headers:{Origin:'https://jouw-driver.duckdns.org'},redirect:'error',signal:AbortSignal.timeout(15000)})).status!==401)throw Error('Legacy client origin rejected');
          if((await fetch(base+'/documents/receipts/invalid',{redirect:'error',signal:AbortSignal.timeout(15000)})).status!==404)throw Error('Invalid document capability accepted');
          for(const host of ['https://jouww.com','https://www.jouww.com','https://jouw-driver.duckdns.org'])if((await fetch(host+'/privacy-policy',{redirect:'error',signal:AbortSignal.timeout(15000)})).status!==200)throw Error('Preserved HTTPS host failed');
          console.log('Production pages, access restrictions and HTTPS hosts verified.');
          ACCEPT
          node --input-type=module <<'STATE'
          import fs from 'node:fs';
          const old=JSON.parse(fs.readFileSync('runtime-mode.json'));
          const state={...old,image:process.env.ONBOARDING_RELEASE_IMAGE,revision:process.env.ONBOARDING_RELEASE_REVISION,deployedAt:new Date().toISOString(),previousImage:old.image,verifiedPrelaunchBackup:process.env.ONBOARDING_RELEASE_BACKUP};
          for(const p of ['runtime-mode.json','/srv/jouw-driver/release.json'])fs.writeFileSync(p,JSON.stringify(state,null,2)+'\n',{mode:0o600});
          STATE
          updated=true
          printf 'Company onboarding deployed and health checks passed.\n'
          REMOTE
