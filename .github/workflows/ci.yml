name: Application checks
on:
  push:
    paths-ignore: ['**/*.md', 'tests/verification/**', 'security/verification/**']
  pull_request:
    paths-ignore: ['**/*.md', 'tests/verification/**', 'security/verification/**']
  workflow_dispatch:
  workflow_call:
    inputs:
      force_native_db:
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0, official tag verified
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0, official tag verified
        with:
          node-version: '22.18.0'
          package-manager-cache: false
      - name: Install pinned package manager and locked dependencies
        run: |
          npm install --global pnpm@11.25.0
          pnpm install --frozen-lockfile
      - name: Check committed files for credential and data exports
        run: node tests/repository-safety.mjs
      - name: Host deployment fail-closed checks
        run: node --test deploy/tests/*.test.mjs
      - name: Type checking
        run: pnpm typecheck
      - name: Unit, conversion and isolated PostgreSQL privilege tests
        run: |
          npm install --prefix "$RUNNER_TEMP/jd-pglite" --no-audit --no-fund --ignore-scripts @electric-sql/pglite@0.3.14
          PGLITE_MODULE_PATH="$RUNNER_TEMP/jd-pglite/node_modules/@electric-sql/pglite/dist/index.js" node --experimental-strip-types --test tests/*.test.mjs
      - name: Mobile locked dependencies and native location/config checks
        run: |
          npm ci --prefix mobile --ignore-scripts --no-audit --no-fund
          node --experimental-strip-types --test mobile/tests/*.test.mjs
      - name: Production dependency advisory checks
        run: |
          pnpm audit --prod
          npm audit --prefix mobile --omit=dev
      - name: HTTP security checks
        run: node tests/run-http.mjs
      - name: Production build
        env:
          NEXT_PUBLIC_MAPBOX_ACCESS_TOKEN: pk_test
        run: pnpm build
      - name: Install browser for portal regression checks
        run: |
          npm install --prefix "$RUNNER_TEMP/portal-ui" --no-audit --no-fund --ignore-scripts playwright@1.56.1
          node "$RUNNER_TEMP/portal-ui/node_modules/playwright/cli.js" install --with-deps chromium
      - name: Company, account, trip and fleet browser regressions
        run: UI_PLAYWRIGHT_PATH="$RUNNER_TEMP/portal-ui/node_modules/playwright/index.mjs" node tests/run-portal-ui.mjs
      - name: Company archive, ledger and permission UI acceptance
        run: OPERATIONS_QA_DIR="$RUNNER_TEMP/operations-qa" UI_PLAYWRIGHT_PATH="$RUNNER_TEMP/portal-ui/node_modules/playwright/index.mjs" node tests/run-operations-ui.mjs
      - name: Web proposals, roles and local cash billing acceptance
        run: OPERATIONS_QA_DIR="$RUNNER_TEMP/web-qa" UI_PLAYWRIGHT_PATH="$RUNNER_TEMP/portal-ui/node_modules/playwright/index.mjs" node tests/run-web-approvals-ui.mjs
      - name: Annual contract, signature and linked billing UI acceptance
        run: UI_PLAYWRIGHT_PATH="$RUNNER_TEMP/portal-ui/node_modules/playwright/index.mjs" node tests/run-contract-billing-ui.mjs
      - name: Email contract signing, evidence, print and safe retry
        run: UI_PLAYWRIGHT_PATH="$RUNNER_TEMP/portal-ui/node_modules/playwright/index.mjs" node tests/run-email-contract-ui.mjs
      - name: Mapbox failure and durable driver trip start regression
        run: UI_PLAYWRIGHT_PATH="$RUNNER_TEMP/portal-ui/node_modules/playwright/index.mjs" node tests/run-mapbox-trip-ui.mjs
      - name: Cookie preferences persistence and non-blocking dismissal
        run: UI_PLAYWRIGHT_PATH="$RUNNER_TEMP/portal-ui/node_modules/playwright/index.mjs" node tests/run-cookie-ui.mjs
      - name: Marketing languages, journey, audience and accessibility checks
        run: MARKETING_QA_DIR="$RUNNER_TEMP/marketing-qa" UI_PLAYWRIGHT_PATH="$RUNNER_TEMP/portal-ui/node_modules/playwright/index.mjs" node tests/run-marketing-ui.mjs
      - name: Company registration wizard, localization and safe retry
        run: REGISTRATION_QA_DIR="$RUNNER_TEMP/registration-qa" UI_PLAYWRIGHT_PATH="$RUNNER_TEMP/portal-ui/node_modules/playwright/index.mjs" node tests/run-company-registration-ui.mjs
      - name: Website email confirmation and password recovery UI
        run: UI_PLAYWRIGHT_PATH="$RUNNER_TEMP/portal-ui/node_modules/playwright/index.mjs" node tests/run-email-auth-ui.mjs
      - name: Declared driver shifts browser and persistence acceptance
        run: PGLITE_MODULE_PATH="$RUNNER_TEMP/jd-pglite/node_modules/@electric-sql/pglite/dist/index.js" UI_PLAYWRIGHT_PATH="$RUNNER_TEMP/portal-ui/node_modules/playwright/index.mjs" node tests/run-driver-shifts-ui.mjs
      - name: Stable receipt links, QR sharing and failure recovery UI
        run: UI_PLAYWRIGHT_PATH="$RUNNER_TEMP/portal-ui/node_modules/playwright/index.mjs" node tests/run-document-ui.mjs
      - name: Administrator welcome publication and failure recovery
        run: UI_PLAYWRIGHT_PATH="$RUNNER_TEMP/portal-ui/node_modules/playwright/index.mjs" node --experimental-strip-types tests/run-app-experience-ui.mjs
      - name: Subscription payment authorization and receipt reconciliation UI
        run: UI_PLAYWRIGHT_PATH="$RUNNER_TEMP/portal-ui/node_modules/playwright/index.mjs" node --experimental-strip-types tests/run-stripe-billing-ui.mjs
      - name: Independent company invoice workspace
        run: UI_PLAYWRIGHT_PATH="$RUNNER_TEMP/portal-ui/node_modules/playwright/index.mjs" node --experimental-strip-types tests/run-manual-invoices-ui.mjs
      - name: Save synthetic marketing previews
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: marketing-previews
          path: ${{ runner.temp }}/marketing-qa/*.png
          retention-days: 7
      - name: Contract preview, document sanitization and print layout
        run: UI_PLAYWRIGHT_PATH="$RUNNER_TEMP/portal-ui/node_modules/playwright/index.mjs" node tests/run-contract-ui.mjs
      - name: Production auth and ownership integration checks
        run: node --experimental-strip-types tests/run-auth-integration.mjs

  native-database:
    # Release calls explicitly require native acceptance; routine private-repo pushes skip hosted Docker minutes.
    if: inputs.force_native_db == true || github.event.repository.private == false
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # official v5.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # official v5.0.0
        with:
          node-version: '22.18.0'
          package-manager-cache: false
      - name: Install locked dependencies
        run: |
          npm install --global pnpm@11.25.0
          pnpm install --frozen-lockfile
      - name: Install age from the Ubuntu package repository
        run: |
          sudo apt-get update -qq
          sudo apt-get install --yes age
      - name: Standalone Docker app, native PostgreSQL, encrypted restore and PostgREST acceptance
        run: node tests/run-database-stack.mjs
