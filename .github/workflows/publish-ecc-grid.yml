name: Publish Database Studio grid on ECC
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ecc-grid-publication
  cancel-in-progress: false
jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    environment: production
    steps:
      - name: Publish only on the host pinned to the Engineering Control Center
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          ECC_DEPLOY_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          BUNDLE_SHA256: a09eb7af6852152c70bc4eadf87393fd3b6b9071d0de801de01f2376863ab6ce
        run: |
          set -euo pipefail
          umask 077
          temporary=$(mktemp -d)
          trap 'rm -rf "$temporary"' EXIT
          printf '%s\n' "$ECC_DEPLOY_KEY" > "$temporary/key"
          unset ECC_DEPLOY_KEY
          ssh-keygen -y -f "$temporary/key" >/dev/null
          printf '%s\n' '141.94.2.5 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIAGerEd8rI8M08uoDCP9G70IBaxVij+D68/sB0AVN77b' > "$temporary/known"
          ecc=(ssh -F /dev/null -T -o BatchMode=yes -o IdentitiesOnly=yes -o ConnectTimeout=12
            -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$temporary/known" -o HostKeyAlgorithms=ssh-ed25519 -i "$temporary/key" ubuntu@141.94.2.5)
          "${ecc[@]}" 'test "$(hostname -s)" = jouw-driver-ecc && test "$(cat /var/lib/cloud/data/instance-id)" = 4a9ba9db-6ef0-4e54-b1e5-35c530f32645'
          gh api "repos/$GITHUB_REPOSITORY/contents/.ecc-read-provision/database-grid-bundle.txt?ref=ecc-read-provision-inbox" --jq '.content' |
            base64 -d | base64 -d > "$temporary/package.tar.gz"
          printf '%s  %s\n' "$BUNDLE_SHA256" "$temporary/package.tar.gz" | sha256sum --check --status
          [[ "$GITHUB_RUN_ID" =~ ^[0-9]+$ ]]
          remote=ecc-grid-$GITHUB_RUN_ID
          "${ecc[@]}" "umask 077; mkdir '$remote'; tar -xz -C '$remote'" < "$temporary/package.tar.gz"
          "${ecc[@]}" "sudo -n bash '$remote/publish-grid.sh' '$GITHUB_RUN_ID'"
