name: Verify customer image UI in isolation
on:
  workflow_dispatch:
    inputs:
      image:
        type: string
        required: true
        description: Verified immutable customer image digest
permissions:
  contents: read
  packages: read
jobs:
  ui:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: '22.18.0'
          package-manager-cache: false
      - name: Install pinned official test browsers
        run: |
          npm install --prefix "$RUNNER_TEMP/ui-tools" --no-audit --no-fund --ignore-scripts playwright@1.56.1
          node "$RUNNER_TEMP/ui-tools/node_modules/playwright/cli.js" install --with-deps chromium webkit
      - name: Pull the verified immutable customer image
        env:
          REGISTRY_TOKEN: ${{ github.token }}
          UI_IMAGE: ${{ inputs.image }}
        run: |
          set -euo pipefail
          [[ "$UI_IMAGE" =~ ^ghcr.io/infojouwdriver-commits/jd@sha256:[a-f0-9]{64}$ ]]
          config=$(mktemp -d)
          export DOCKER_CONFIG="$config"
          trap 'rm -rf "$config"' EXIT
          printf '%s' "$REGISTRY_TOKEN" | docker login ghcr.io -u infojouwdriver-commits --password-stdin >/dev/null 2>&1
          docker pull "$UI_IMAGE"
      - name: Test desktop and WebKit mobile buttons with production CSP
        env:
          UI_IMAGE: ${{ inputs.image }}
        run: UI_PLAYWRIGHT_PATH="$RUNNER_TEMP/ui-tools/node_modules/playwright/index.mjs" node tests/run-customer-ui.mjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: isolated-customer-ui-${{ github.run_id }}
          path: ui-output/
          retention-days: 7
          if-no-files-found: error
