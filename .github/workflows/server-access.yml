name: Verify server access
on:
  workflow_dispatch:
    inputs:
      inspect_domain_runtime:
        type: boolean
        default: false
        description: Read-only domain runtime inventory; no private values or production records
      reclaim_reproducible_cache:
        type: boolean
        default: false
        description: Reclaim old build cache and unused JD images, preserving live and rollback images
permissions:
  contents: read
concurrency:
  group: deploy-production
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: production
    steps:
      - name: Verify pinned SSH connection and server prerequisites
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          RECLAIM_CACHE: ${{ inputs.reclaim_reproducible_cache }}
          INSPECT_DOMAIN: ${{ inputs.inspect_domain_runtime }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$DEPLOY_HOST" =~ ^[a-zA-Z0-9][a-zA-Z0-9.-]*$ ]]
          [[ "$DEPLOY_USER" =~ ^[a-z_][a-z0-9_-]*$ ]]
          test -n "$DEPLOY_KEY" && test -n "$KNOWN_HOSTS"
          umask 077
          keydir=$(mktemp -d)
          trap 'rm -f "$keydir/key" "$keydir/known_hosts"; rmdir "$keydir"' EXIT
          printf '%s\n' "$DEPLOY_KEY" > "$keydir/key"
          printf '%s\n' "$KNOWN_HOSTS" > "$keydir/known_hosts"
          [[ "$RECLAIM_CACHE" = true || "$RECLAIM_CACHE" = false ]]
          [[ "$INSPECT_DOMAIN" = true || "$INSPECT_DOMAIN" = false ]]
          ssh -i "$keydir/key" -o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$keydir/known_hosts" -o ConnectTimeout=20 "$DEPLOY_USER@$DEPLOY_HOST" "bash -s -- '$RECLAIM_CACHE' '$INSPECT_DOMAIN'" <<'REMOTE'
          set -euo pipefail
          printf 'SSH identity verified\n'
          uname -sr
          whoami
          sudo -n true
          printf 'sudo access verified\n'
          command -v docker || true
          command -v node || true
          df -h /
          df -i /
          docker system df
          if test "$1" = true; then
            # Reproducible cache only; never remove volumes, backups or application files.
            # No build cache exists on this pull-only host; avoid buildx creating
            # client configuration while the filesystem is already full.
            node --input-type=module <<'RECLAIM'
          import fs from 'node:fs';
          import {execFileSync} from 'node:child_process';
          const docker=(...args)=>execFileSync('docker',args,{encoding:'utf8'}).trim();
          const state=JSON.parse(fs.readFileSync('/srv/jouw-driver/foundation/runtime-mode.json'));
          const release=JSON.parse(fs.readFileSync('/srv/jouw-driver/release.json'));
          if(state.mode!=='public'||state.image!==release.image)throw Error('Runtime state mismatch');
          const protectedIds=new Set();
          for(const ref of [state.image,state.previousImage,release.image,release.previousImage].filter(Boolean)){
            protectedIds.add(JSON.parse(docker('image','inspect',ref))[0].Id);
          }
          const containers=docker('ps','--all','--quiet').split('\n').filter(Boolean);
          for(const container of containers)protectedIds.add(JSON.parse(docker('container','inspect',container))[0].Image);
          const source='https://github.com/infojouwdriver-commits/jd';
          const ids=[...new Set(docker('image','ls','--quiet','--no-trunc','--filter','label=org.opencontainers.image.source='+source).split('\n').filter(Boolean))];
          for(const id of ids){
            const image=JSON.parse(docker('image','inspect',id))[0];
            if(protectedIds.has(id)||image.Config.Labels?.['org.opencontainers.image.source']!==source||Date.now()-Date.parse(image.Created)<48*60*60*1000)continue;
            // No force: Docker also refuses to remove images referenced by a container.
            console.log(docker('image','rm',id));
          }
          console.log('Live/rollback images and every container image preserved.');
          RECLAIM
            df -h /
            docker system df
          fi
          free -h
          test ! -e /srv/jouw-driver/.env || printf 'Server configuration already exists; preserve it\n'
          if test "$2" = true; then
            cd /srv/jouw-driver/foundation
            node --input-type=module <<'DOMAIN_INVENTORY'
          import fs from 'node:fs';
          import {createHash} from 'node:crypto';
          import {execFileSync} from 'node:child_process';
          const read=p=>fs.readFileSync(p,'utf8');
          const state=JSON.parse(read('runtime-mode.json'));
          const release=JSON.parse(read('/srv/jouw-driver/release.json'));
          const caddy=read('Caddyfile'),compose=read('private-app.yaml');
          const env=new Map(read('.app-staging.env').split(/\r?\n/).filter(x=>x&&!x.startsWith('#')).map(x=>{const i=x.indexOf('=');return [x.slice(0,i),x.slice(i+1)];}));
          const known=['https://jouw-driver.duckdns.org','https://app.jouww.com'];
          const imagePattern=/^ghcr\.io\/infojouwdriver-commits\/jd@sha256:[a-f0-9]{64}$/;
          if(!imagePattern.test(state.image)||!/^[a-f0-9]{40}$/.test(state.revision))throw Error('Unexpected runtime metadata; values withheld');
          const report={readOnly:true,mode:state.mode==='public'?'public':'other',image:state.image,revision:state.revision,releaseAgreement:state.image===release.image&&state.revision===release.revision,composeImageAgreement:compose.includes(state.image),caddySha256:createHash('sha256').update(caddy).digest('hex'),configuredHosts:Object.fromEntries(['jouw-driver.duckdns.org','jouww.com','www.jouww.com','app.jouww.com'].map(h=>[h,caddy.includes(h)])),appOrigin:known.includes(env.get('APP_ORIGIN'))?env.get('APP_ORIGIN'):'other-or-missing',requiredKeyPresence:Object.fromEntries(['JWT_SECRET','DATA_ENCRYPTION_KEY','HASH_SALT_KEY','RATE_LIMIT_SECRET','POSTGREST_URL'].map(k=>[k,Boolean(env.get(k))])),trustedOrigins:env.has('TRUSTED_ORIGINS')?'configured-values-withheld':'absent'};
          const docker=(...args)=>execFileSync('docker',args,{encoding:'utf8',stdio:['ignore','pipe','pipe'],timeout:15000}).trim();
          const ids=docker('ps','--quiet').split('\n').filter(Boolean);
          report.proxy=ids.map(id=>JSON.parse(docker('inspect','--format','{{json .Config.Image}}',id))).filter(x=>/^caddy(?::|@)/.test(x));
          report.proxyMounts=[];
          for(const id of ids){const img=JSON.parse(docker('inspect','--format','{{json .Config.Image}}',id));if(/^caddy(?::|@)/.test(img)){const mounts=JSON.parse(docker('inspect','--format','{{json .Mounts}}',id));report.proxyMounts=mounts.map(m=>({destination:m.Destination,readOnly:!m.RW}));}}
          report.httpsChecks={};
          for(const host of ['jouw-driver.duckdns.org','jouww.com','www.jouww.com','app.jouww.com']){try{report.httpsChecks[host]=execFileSync('curl',['--proto','=https','--tlsv1.2','--resolve',host+':443:127.0.0.1','--max-time','10','--silent','--fail','--output','/dev/null','--write-out','%{http_code}','https://'+host+'/privacy-policy'],{encoding:'utf8',stdio:['ignore','pipe','pipe'],timeout:12000});}catch(e){report.httpsChecks[host]='unavailable-exit-'+e.status;}}
          console.log(JSON.stringify(report,null,2));
          DOMAIN_INVENTORY
          fi
          REMOTE
