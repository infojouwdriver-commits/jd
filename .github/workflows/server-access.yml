name: Bootstrap dedicated ECC host
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  bootstrap:
    if: github.ref == 'refs/heads/ecc-host-key-bootstrap'
    runs-on: ubuntu-latest
    timeout-minutes: 6
    environment: production
    steps:
      - name: Install the dedicated public key on the separately provisioned ECC instance
        shell: bash
        env:
          ACCESS_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          SEALED_PLAN: ''
        run: |
          set -euo pipefail
          umask 077
          tmp=$(mktemp -d)
          trap 'rm -rf "$tmp"' EXIT
          printf '%s\n' "$ACCESS_KEY" > "$tmp/access_key"
          unset ACCESS_KEY
          python3 -m venv "$tmp/venv"
          "$tmp/venv/bin/python" -m pip --quiet install 'PyNaCl==1.6.2' 'cryptography==46.0.3'
          "$tmp/venv/bin/python" - "$tmp" <<'PY'
          import ipaddress, json, os, pathlib, re, sys, base64
          from cryptography.hazmat.primitives.serialization import load_ssh_private_key, Encoding, PrivateFormat, NoEncryption
          from nacl.signing import SigningKey
          from nacl.public import SealedBox
          root = pathlib.Path(sys.argv[1])
          key = load_ssh_private_key((root/"access_key").read_bytes(), password=None)
          raw = key.private_bytes(Encoding.Raw, PrivateFormat.Raw, NoEncryption())
          plan = json.loads(SealedBox(SigningKey(raw).to_curve25519_private_key()).decrypt(base64.b64decode(os.environ["SEALED_PLAN"])))
          ip = ipaddress.IPv4Address(plan["host"])
          assert ip.is_global
          for name in ("known_host", "add_key"):
              assert re.fullmatch(r"ssh-ed25519 [A-Za-z0-9+/=]+(?: [A-Za-z0-9._-]+)?", plan[name])
          assert re.fullmatch(r"[0-9a-f-]{36}", plan["server_uuid"])
          (root/"host").write_text(str(ip))
          (root/"known_hosts").write_text(str(ip)+" "+plan["known_host"]+"\n")
          (root/"instance").write_text(plan["server_uuid"])
          (root/"add_key").write_text("restrict "+plan["add_key"])
          PY
          host=$(cat "$tmp/host")
          instance=$(cat "$tmp/instance")
          add_key=$(cat "$tmp/add_key")
          ssh -F /dev/null -i "$tmp/access_key" -o IdentitiesOnly=yes -o BatchMode=yes -o ConnectTimeout=12 \
            -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$tmp/known_hosts" "ubuntu@$host" \
            "bash -s -- '$instance' '$add_key'" <<'REMOTE'
          set -euo pipefail
          test "$(hostname -s)" = jouw-driver-ecc
          test "$(cat /var/lib/cloud/data/instance-id)" = "$1"
          umask 077
          mkdir -p "$HOME/.ssh"
          touch "$HOME/.ssh/authorized_keys"
          chmod 700 "$HOME/.ssh"
          chmod 600 "$HOME/.ssh/authorized_keys"
          if ! grep -Fqx -- "$2" "$HOME/.ssh/authorized_keys"; then
            printf '%s\n' "$2" >> "$HOME/.ssh/authorized_keys"
          fi
          grep -Fqx -- "$2" "$HOME/.ssh/authorized_keys"
          printf '%s\n' 'Dedicated ECC deployment key verified on the new host.'
          REMOTE
