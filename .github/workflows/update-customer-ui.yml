name: Update verified customer login UI
on:
  workflow_dispatch:
    inputs:
      image:
        type: string
        required: true
        description: Verified immutable image digest
      revision:
        type: string
        required: true
        description: Tested full source revision
      release_run:
        type: string
        required: true
        description: Successful release workflow run
      ui_run:
        type: string
        required: true
        description: Successful isolated UI workflow run
      backup_run:
        type: string
        required: true
        description: Successful backup of current live release
permissions:
  contents: read
  actions: read
  packages: read
concurrency:
  group: deploy-production
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: production
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          persist-credentials: false
      - name: Verify release, UI, backup and UI-only source scope
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node --input-type=module <<'GATE'
          import fs from 'node:fs';
          const i=JSON.parse(fs.readFileSync(process.env.GITHUB_EVENT_PATH)).inputs;
          if(!/^ghcr\.io\/infojouwdriver-commits\/jd@sha256:[a-f0-9]{64}$/.test(i.image)||!/^[a-f0-9]{40}$/.test(i.revision))throw Error('Invalid release');
          const api=async p=>{const r=await fetch('https://api.github.com/repos/'+process.env.GITHUB_REPOSITORY+p,{headers:{Authorization:'Bearer '+process.env.GH_TOKEN,Accept:'application/vnd.github+json'}});if(!r.ok)throw Error('Acceptance unavailable');return r.json();};
          for(const [id,path]of [[i.release_run,'release.yml'],[i.ui_run,'verify-customer-ui.yml'],[i.backup_run,'backup-foundation.yml']]){
          if(!/^[1-9][0-9]+$/.test(id))throw Error('Acceptance required');const r=await api('/actions/runs/'+id);
          if(r.status!=='completed'||r.conclusion!=='success'||r.path!=='.github/workflows/'+path)throw Error('Acceptance did not pass');
          if(path!=='backup-foundation.yml'&&r.head_sha!==i.revision)throw Error('Acceptance revision mismatch');
          }
          const c=await api('/compare/fccc2600118dab9c08fffae919c916e40c47f180...'+i.revision);
          const allowed=new Set(['src/components/auth/LoginPageClient.tsx','tests/run-customer-ui.mjs','.github/workflows/verify-customer-ui.yml','.github/workflows/update-customer-ui.yml','deploy/update-customer-ui.sh']);
          if(!c.files?.length||c.files.some(f=>!allowed.has(f.filename)&&!/^docs\/.*\.md$/.test(f.filename)))throw Error('Only reviewed UI and acceptance changes allowed');
          console.log('Verified release, isolated UI, recoverable live backup and UI-only change scope.');
          GATE
      - name: Update the existing protected runtime with pinned SSH
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          REGISTRY_TOKEN: ${{ github.token }}
          IMAGE: ${{ inputs.image }}
          REVISION: ${{ inputs.revision }}
          BACKUP_RUN: ${{ inputs.backup_run }}
        run: |
          set -euo pipefail
          umask 077
          keydir=$(mktemp -d)
          trap 'rm -rf "$keydir"' EXIT
          printf '%s\n' "$DEPLOY_KEY" > "$keydir/key"
          printf '%s\n' "$KNOWN_HOSTS" > "$keydir/known_hosts"
          [[ "$DEPLOY_HOST" =~ ^[a-zA-Z0-9][a-zA-Z0-9.-]*$ ]]
          [[ "$DEPLOY_USER" =~ ^[a-z_][a-z0-9_-]*$ ]]
          [[ "$BACKUP_RUN" =~ ^[0-9]+$ ]]
          args=(-i "$keydir/key" -o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$keydir/known_hosts" -o ConnectTimeout=20)
          scp "${args[@]}" deploy/update-customer-ui.sh "$DEPLOY_USER@$DEPLOY_HOST:/srv/jouw-driver/customer-release/"
          printf '%s\n' "$REGISTRY_TOKEN" | ssh "${args[@]}" "$DEPLOY_USER@$DEPLOY_HOST" "set -eu; umask 077; read -r token; config=\$(mktemp -d); export DOCKER_CONFIG=\"\$config\"; trap 'rm -rf \"\$config\"' EXIT; printf '%s' \"\$token\" | docker login ghcr.io -u infojouwdriver-commits --password-stdin >/dev/null 2>&1; unset token; docker pull '$IMAGE'"
          ssh "${args[@]}" "$DEPLOY_USER@$DEPLOY_HOST" "bash /srv/jouw-driver/customer-release/update-customer-ui.sh '$IMAGE' '$REVISION' '$BACKUP_RUN-1'" </dev/null
