name: Update verified customer UI
on:
  workflow_dispatch:
    inputs:
      image:
        type: string
        required: true
        description: Verified immutable image digest
      revision:
        type: string
        required: true
        description: Tested full source revision
      release_run:
        type: string
        required: true
        description: Successful release workflow run
      ui_run:
        type: string
        required: true
        description: Successful isolated UI workflow run
      backup_run:
        type: string
        required: true
        description: Successful backup of current live release
permissions:
  contents: read
  actions: read
  packages: read
concurrency:
  group: deploy-production
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: production
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          persist-credentials: false
      - name: Verify release, UI, backup and reviewed portal source scope
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node --input-type=module <<'GATE'
          import fs from 'node:fs';import os from 'node:os';import {execFileSync} from 'node:child_process';import {createHash} from 'node:crypto';
          const i=JSON.parse(fs.readFileSync(process.env.GITHUB_EVENT_PATH)).inputs;
          if(!/^ghcr\.io\/infojouwdriver-commits\/jd@sha256:[a-f0-9]{64}$/.test(i.image)||!/^[a-f0-9]{40}$/.test(i.revision))throw Error('Invalid release');
          const api=async p=>{const r=await fetch('https://api.github.com/repos/'+process.env.GITHUB_REPOSITORY+p,{headers:{Authorization:'Bearer '+process.env.GH_TOKEN,Accept:'application/vnd.github+json'}});if(!r.ok)throw Error('Acceptance unavailable');return r.json();};
          for(const [id,path]of [[i.release_run,'release.yml'],[i.ui_run,'verify-customer-ui.yml'],[i.backup_run,'backup-foundation.yml']]){
          if(!/^[1-9][0-9]+$/.test(id))throw Error('Acceptance required');const r=await api('/actions/runs/'+id);
          if(r.status!=='completed'||r.conclusion!=='success'||r.path!=='.github/workflows/'+path)throw Error('Acceptance did not pass');
          if(path==='release.yml'&&r.head_sha!==i.revision)throw Error('Release revision mismatch');
          }
          const artifacts=await api('/actions/runs/'+i.ui_run+'/artifacts');
          const a=artifacts.artifacts?.find(a=>a.name==='isolated-customer-ui-'+i.ui_run&&!a.expired);
          if(!a)throw Error('UI image proof missing');
          const response=await fetch('https://api.github.com/repos/'+process.env.GITHUB_REPOSITORY+'/actions/artifacts/'+a.id+'/zip',{headers:{Authorization:'Bearer '+process.env.GH_TOKEN,Accept:'application/vnd.github+json'}});
          if(!response.ok)throw Error('Cannot read UI proof');const bytes=Buffer.from(await response.arrayBuffer());
          if(a.digest&&a.digest!=='sha256:'+createHash('sha256').update(bytes).digest('hex'))throw Error('UI proof integrity mismatch');
          const dir=fs.mkdtempSync(os.tmpdir()+'/ui-proof-');
          try{fs.writeFileSync(dir+'/proof.zip',bytes,{mode:0o600});const proof=JSON.parse(execFileSync('unzip',['-p',dir+'/proof.zip','verification.json'],{encoding:'utf8'}));if(proof.image!==i.image||proof.checks?.length!==20)throw Error('UI acceptance image mismatch');}finally{fs.rmSync(dir,{recursive:true,force:true});}
          const c=await api('/compare/fccc2600118dab9c08fffae919c916e40c47f180...'+i.revision);
          const allowed=new Set(["src/components/landing/LandingPage.tsx","src/components/auth/AuthProvider.tsx","src/components/auth/LoginPageClient.tsx","src/lib/chiron-service.ts","src/lib/chiron-retry.ts","src/app/next_api/test-trips/acceptance-test/route.ts","src/app/next_api/test-trips/send/route.ts","src/app/next_api/trips/retry-sync/route.ts","src/app/next_api/chiron/sync/route.ts","src/app/next_api/chiron-sync/retry/route.ts","src/app/next_api/chiron-settings/route.ts","src/app/admin/chiron-sync/page.tsx","src/app/admin/companies/[id]/chiron-settings/page.tsx","tests/run-database-stack.mjs","deploy/Caddyfile.customers","deploy/update-customer-ui.sh","src/app/globals.css","tests/run-customer-ui.mjs","src/app/admin/companies/page.tsx","src/app/admin/companies/[id]/settings/page.tsx","src/lib/chiron-protocol.ts","tests/chiron-flow.test.mjs",".github/workflows/verify-customer-ui.yml",".github/workflows/update-customer-ui.yml"]);
          if(!c.files?.length||c.files.some(f=>!allowed.has(f.filename)&&!/^docs\/.*\.md$/.test(f.filename)))throw Error('Only reviewed portal and acceptance changes allowed');
          console.log('Verified release, isolated UI, recoverable live backup and reviewed portal change scope.');
          GATE
      - name: Update the existing protected runtime with pinned SSH
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          REGISTRY_TOKEN: ${{ github.token }}
          IMAGE: ${{ inputs.image }}
          REVISION: ${{ inputs.revision }}
          BACKUP_RUN: ${{ inputs.backup_run }}
        run: |
          set -euo pipefail
          umask 077
          keydir=$(mktemp -d)
          trap 'rm -rf "$keydir"' EXIT
          printf '%s\n' "$DEPLOY_KEY" > "$keydir/key"
          printf '%s\n' "$KNOWN_HOSTS" > "$keydir/known_hosts"
          [[ "$DEPLOY_HOST" =~ ^[a-zA-Z0-9][a-zA-Z0-9.-]*$ ]]
          [[ "$DEPLOY_USER" =~ ^[a-z_][a-z0-9_-]*$ ]]
          [[ "$BACKUP_RUN" =~ ^[0-9]+$ ]]
          args=(-i "$keydir/key" -o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$keydir/known_hosts" -o ConnectTimeout=20)
          scp "${args[@]}" deploy/update-customer-ui.sh deploy/Caddyfile.customers "$DEPLOY_USER@$DEPLOY_HOST:/srv/jouw-driver/customer-release/"
          printf '%s\n' "$REGISTRY_TOKEN" | ssh "${args[@]}" "$DEPLOY_USER@$DEPLOY_HOST" "set -eu; umask 077; read -r token; config=\$(mktemp -d); export DOCKER_CONFIG=\"\$config\"; trap 'rm -rf \"\$config\"' EXIT; printf '%s' \"\$token\" | docker login ghcr.io -u infojouwdriver-commits --password-stdin >/dev/null 2>&1; unset token; docker pull '$IMAGE'"
          ssh "${args[@]}" "$DEPLOY_USER@$DEPLOY_HOST" "bash /srv/jouw-driver/customer-release/update-customer-ui.sh '$IMAGE' '$REVISION' '$BACKUP_RUN-1'" </dev/null
