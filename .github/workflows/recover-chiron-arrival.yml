name: Record the confirmed Chiron arrival without resending
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: deploy-production
  cancel-in-progress: false
jobs:
  record-receipt:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    environment: production
    steps:
      - name: Record the verified arrival response for one exact trip
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          umask 077
          [[ "$DEPLOY_HOST" =~ ^[a-zA-Z0-9][a-zA-Z0-9.-]*$ ]]
          [[ "$DEPLOY_USER" =~ ^[a-z_][a-z0-9_-]*$ ]]
          test -n "$DEPLOY_KEY" && test -n "$KNOWN_HOSTS"
          keydir=$(mktemp -d)
          trap 'rm -rf "$keydir"' EXIT
          printf '%s\n' "$DEPLOY_KEY" > "$keydir/key"
          printf '%s\n' "$KNOWN_HOSTS" > "$keydir/known_hosts"
          ssh -i "$keydir/key" -o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$keydir/known_hosts" -o ConnectTimeout=20 "$DEPLOY_USER@$DEPLOY_HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          cd /srv/jouw-driver/foundation
          docker compose --env-file .database.env --project-name jouw-driver --file compose.yaml exec -T db psql -U postgres -d jouw_driver -v ON_ERROR_STOP=1 -Atq <<'SQL'
          BEGIN;
          SET LOCAL lock_timeout='5s';
          SET LOCAL statement_timeout='5s';
          -- Recovery run 42816937724 returned HTTP 201, Chiron OK and an empty error list.
          WITH target AS (
            SELECT id FROM public.trips WHERE encode(sha256(convert_to(ritnummer,'UTF8')),'hex')='5e55f547c36cabba6ec36385c9a3fc844be4818f97e1c5ef4db6323f9a326a7a'
          ), recorded AS (
            UPDATE public.trips t
            SET chiron_sync_state='COMPLETED',sync_error_message=NULL,
                arrival_sync_response=jsonb_build_object('accepted',true,'httpStatus',201),
                arrival_sent_at='2026-11-10T12:34:52.030912Z'::timestamptz
            FROM target WHERE (SELECT count(*) FROM target)=1 AND t.id=target.id
              AND t.chiron_realtime AND t.chiron_environment='production' AND t.status='completed'
              AND t.chiron_sync_state='ARRIVAL_SENT' AND t.chiron_sync_attempts=2
              AND t.start_sync_response->>'source'='chiron_trip_report' AND t.start_sync_response->>'accepted'='true'
              AND t.arrival_sync_response IS NULL AND t.arrival_sent_at IS NULL
              AND t.sync_error_message='CHIRON_DELIVERY_UNCERTAIN'
              AND t.last_sync_attempt BETWEEN '2026-11-10T12:34:35Z'::timestamptz AND '2026-11-10T12:34:53Z'::timestamptz
            RETURNING t.chiron_sync_state,t.arrival_sync_response
          )
          SELECT json_build_object('updated',count(*),'state',max(chiron_sync_state),
            'accepted',bool_and(arrival_sync_response->>'accepted'='true')) FROM recorded;
          COMMIT;
          SQL
          REMOTE
