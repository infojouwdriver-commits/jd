name: Temporary refresh of clean marketing URL code map
on:
  push:
    branches:
      - feat/clean-marketing-urls-gsc-20261028
    paths:
      - .github/workflows/refresh-gsc-map-temp.yml
permissions:
  contents: write
concurrency:
  group: clean-links-gsc-graphify
  cancel-in-progress: false
jobs:
  refresh:
    if: github.repository == 'infojouwdriver-commits/jd'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          persist-credentials: true
          fetch-depth: 1
      - name: Refresh allowlisted local-only Graphify source map
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check --user 'graphifyy[sql]==0.9.92'
          python3 scripts/code-map.py
          python3 scripts/code-map.py --check
      - name: Commit only Graphify artifacts
        run: |
          set -euo pipefail
          git add -- graphify-out/graph.json graphify-out/GRAPH_REPORT.md graphify-out/GRAPH_TREE.html graphify-out/SOURCE_INDEX.md graphify-out/health.json graphify-out/source-manifest.json
          if git diff --cached --quiet; then
            echo 'Map is already current'
            exit 0
          fi
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'chore: refresh source map for clean marketing URLs'
          git push origin HEAD:feat/clean-marketing-urls-gsc-20261028
