name: Publish verified company registration and BCE Open Data
on:
  workflow_dispatch:
    inputs:
      image:
        description: Immutable candidate image digest
        type: string
        required: true
      acceptance_run:
        description: Successful exact-image acceptance run from main
        type: string
        required: true
      backup_run:
        description: Successful recent encrypted backup and restore drill
        type: string
        required: true
permissions:
  contents: read
  actions: read
  packages: read
concurrency:
  group: deploy-production
  cancel-in-progress: false
env:
  REVISION: d9daeb8cc8cc548c8c1f8b2336bdff868a44202d
  BASELINE: 3fd05774ccd7c9cd47289c6b46fbb85d3245938d
  BUILD_RUN: '45045116972'
  DATA_SHA: 0590153316a5c077b0031d88f0da2a06c9e57b487b1b5ab90c52d88df96ffa44
  DATA_NAME: JOUW-DRIVER-BCE-KBO-2026-11-21.sqlite.gz
jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: production
    permissions:
      contents: write # The one-time data asset is available only as a private draft.
      actions: read
      packages: read
    steps:
      - name: Verify protected source, candidate image acceptance and backup
        id: verified
        env:
          GH_TOKEN: ${{ github.token }}
          IMAGE: ${{ inputs.image }}
          ACCEPTANCE_RUN: ${{ inputs.acceptance_run }}
          BACKUP_RUN: ${{ inputs.backup_run }}
        run: |
          node --input-type=module <<'GATE'
          import fs from 'node:fs';
          import {execFileSync} from 'node:child_process';
          const {IMAGE,REVISION,BUILD_RUN,ACCEPTANCE_RUN,BACKUP_RUN}=process.env;
          if (!/^ghcr\.io\/infojouwdriver-commits\/jd@sha256:[a-f0-9]{64}$/.test(IMAGE)) throw Error('Expected immutable JOUW DRIVER image');
          const headers={Authorization:'Bearer '+process.env.GH_TOKEN,Accept:'application/vnd.github+json'};
          const api=async (path,accept=headers.Accept)=>{
            const response=await fetch('https://api.github.com/repos/'+process.env.GITHUB_REPOSITORY+path,{headers:{...headers,Accept:accept},signal:AbortSignal.timeout(60000)});
            if (!response.ok) throw Error('Cannot verify deployment evidence: HTTP '+response.status);
            return response;
          };
          const get=async path=>(await api(path)).json();
          const comparison=await get('/compare/'+REVISION+'...'+process.env.GITHUB_SHA);
          const workflow='.github/workflows/publish-company-registration-open-data.yml';
          if (comparison.status!=='ahead'||comparison.files?.length!==1||comparison.files[0].filename!==workflow) throw Error('Main differs from candidate beyond the deployment workflow');
          const loadRun=async (id,workflow)=>{
            if (!/^[1-9][0-9]+$/.test(id)) throw Error('Expected workflow run ID');
            const run=await get('/actions/runs/'+id);
            if (run.status!=='completed'||run.conclusion!=='success'||run.path!=='.github/workflows/'+workflow) throw Error('Required release evidence has not succeeded');
            return run;
          };
          const build=await loadRun(BUILD_RUN,'release-domain-candidate.yml');
          const accepted=await loadRun(ACCEPTANCE_RUN,'verify-domain-image.yml');
          const backup=await loadRun(BACKUP_RUN,'backup-foundation.yml');
          const age=Date.now()-Date.parse(backup.updated_at);
          if (build.head_sha!==REVISION||accepted.head_branch!=='main'||backup.head_branch!=='main'||!Number.isFinite(age)||age<0||age>86400000) throw Error('Wrong revision or backup evidence');
          const {artifacts}=await get('/actions/runs/'+ACCEPTANCE_RUN+'/artifacts');
          const proof=artifacts.find(a=>a.name==='jouww-image-acceptance-'+ACCEPTANCE_RUN&&!a.expired);
          if (!proof) throw Error('Exact-image proof unavailable');
          const data=await api('/actions/artifacts/'+proof.id+'/zip');
          fs.writeFileSync(process.env.RUNNER_TEMP+'/company-acceptance.zip',Buffer.from(await data.arrayBuffer()),{mode:0o600});
          const acceptance=JSON.parse(execFileSync('unzip',['-p',process.env.RUNNER_TEMP+'/company-acceptance.zip','candidate-native-proof.json'],{encoding:'utf8'}));
          if (acceptance.candidateImage!==IMAGE||acceptance.passed!==acceptance.checks?.length||!acceptance.checks.includes('Reconstructed schema and full deployment migration sequence applied on native PostgreSQL')) throw Error('Native image proof is incomplete');
          const releases=await get('/releases?per_page=100');
          const drafts=releases.filter(r=>r.draft&&r.name==='Private transfer · BCE/KBO 2026-11-21');
          const assets=drafts.length===1?drafts[0].assets.filter(a=>a.name===process.env.DATA_NAME&&a.state==='uploaded'):[];
          if(assets.length!==1||!Number.isSafeInteger(assets[0].id))throw Error('Private transfer draft or asset unavailable');
          fs.appendFileSync(process.env.GITHUB_OUTPUT,`backup=${backup.id}-${backup.run_attempt}\nbuild_attempt=${build.run_attempt}\nasset=${assets[0].id}\n`);
          GATE
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          ref: ${{ env.REVISION }}
          persist-credentials: false
      - name: Transfer the verified index privately and update the application
        env:
          GH_TOKEN: ${{ github.token }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          IMAGE: ${{ inputs.image }}
          BACKUP: ${{ steps.verified.outputs.backup }}
          BUILD_ATTEMPT: ${{ steps.verified.outputs.build_attempt }}
          ASSET: ${{ steps.verified.outputs.asset }}
        run: |
          set -euo pipefail
          umask 077
          [[ "$DEPLOY_HOST" =~ ^[a-zA-Z0-9][a-zA-Z0-9.-]*$ && "$DEPLOY_USER" =~ ^[a-z_][a-z0-9_-]*$ ]]
          [[ "$IMAGE" =~ ^ghcr\.io/infojouwdriver-commits/jd@sha256:[a-f0-9]{64}$ ]]
          [[ "$BACKUP" =~ ^[0-9]+-[0-9]+$ && "$BUILD_ATTEMPT" =~ ^[0-9]+$ && "$ASSET" =~ ^[0-9]+$ ]]
          test -n "$DEPLOY_KEY" && test -n "$KNOWN_HOSTS"
          transfer=$(mktemp -d)
          trap 'rm -rf "$transfer"' EXIT
          printf '%s\n' "$DEPLOY_KEY" > "$transfer/key"
          printf '%s\n' "$KNOWN_HOSTS" > "$transfer/known_hosts"
          args=(-i "$transfer/key" -o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$transfer/known_hosts" -o ConnectTimeout=20)
          target="$DEPLOY_USER@$DEPLOY_HOST"
          curl --fail --silent --show-error --location --max-time 180 \
            -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/octet-stream' \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/releases/assets/$ASSET" > "$transfer/index.gz"
          test "$(sha256sum "$transfer/index.gz" | cut -d' ' -f1)" = "$DATA_SHA"
          gzip -t "$transfer/index.gz"
          migration_sha=$(sha256sum migrations/20261017_company_registration.sql | cut -d' ' -f1)
          social_sha=$(sha256sum migrations/20261122_company_social_registration.sql | cut -d' ' -f1)
          dest="/srv/jouw-driver/releases/$REVISION/registration-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          ssh "${args[@]}" "$target" "umask 077; mkdir -p '/srv/jouw-driver/releases/$REVISION'; mkdir '$dest'"
          scp "${args[@]}" "$transfer/index.gz" migrations/20261017_company_registration.sql migrations/20261122_company_social_registration.sql "$target:$dest/"
          printf '%s\n' "$GH_TOKEN" | ssh "${args[@]}" "$target" "set -eu; umask 077; read -r token; config=\$(mktemp -d); export DOCKER_CONFIG=\"\$config\"; trap 'rm -rf \"\$config\"' EXIT; printf '%s' \"\$token\" | docker login ghcr.io -u infojouwdriver-commits --password-stdin >/dev/null 2>&1; unset token; docker pull '$IMAGE'"
          ssh "${args[@]}" "$target" "bash -s -- '$IMAGE' '$REVISION' '$BASELINE' '$BACKUP' '$BUILD_RUN/$BUILD_ATTEMPT' '$DATA_SHA' '$migration_sha' '$social_sha' '$dest'" <<'REMOTE'
          set -euo pipefail
          umask 077
          export IMAGE=$1 REVISION=$2 BASELINE=$3 BACKUP=$4 BUILD=$5 DATA_SHA=$6 MIGRATION_SHA=$7 SOCIAL_SHA=$8 TRANSFER=$9
          cd /srv/jouw-driver/foundation
          backup_file="/srv/jouw-driver/backups/foundation-$BACKUP.tar.age"
          test "$(sha256sum "$backup_file" | cut -d' ' -f1)" = "$(cat "/srv/jouw-driver/backups/foundation-$BACKUP.sha256")"
          test "$(docker inspect --format '{{index .Config.Labels "org.opencontainers.image.revision"}}' "$IMAGE")" = "$REVISION"
          test "$(docker inspect --format '{{index .Config.Labels "com.jouwdriver.portal-origin"}}' "$IMAGE")" = https://app.jouww.com
          test "$(docker inspect --format '{{index .Config.Labels "com.jouwdriver.build-run"}}' "$IMAGE")" = "$BUILD"
          test "$(sha256sum "$TRANSFER/index.gz" | cut -d' ' -f1)" = "$DATA_SHA"
          test "$(sha256sum "$TRANSFER/20261017_company_registration.sql" | cut -d' ' -f1)" = "$MIGRATION_SHA"
          test "$(sha256sum "$TRANSFER/20261122_company_social_registration.sql" | cut -d' ' -f1)" = "$SOCIAL_SHA"
          grep -qx 'APP_ORIGIN=https://app.jouww.com' .app-staging.env
          mkdir /srv/jouw-driver/.deployment-lock
          work=''
          changed=false
          succeeded=false
          cleanup(){
            status=$?
            trap - EXIT
            if test "$changed" = true && test "$succeeded" = false; then
              cp "$work/private-app.yaml" private-app.yaml
              cp "$work/runtime-mode.json" runtime-mode.json
              cp "$work/release.json" /srv/jouw-driver/release.json
              docker compose --env-file .app-staging.env --project-name jouw-driver --file private-app.yaml up -d --no-deps --wait --wait-timeout 180 app </dev/null || printf 'Previous application requires operator recovery\n' >&2
            fi
            test -z "$work" || rm -rf "$work"
            rmdir /srv/jouw-driver/.deployment-lock
            exit "$status"
          }
          trap cleanup EXIT
          work=$(mktemp -d .registration-release.XXXXXX)
          cp private-app.yaml runtime-mode.json "$work/"
          cp /srv/jouw-driver/release.json "$work/release.json"
          sha256sum .app-staging.env .database.env Caddyfile compose.yaml > "$work/preserved.sha256"
          node --input-type=module <<'BEFORE'
          import fs from 'node:fs';
          const state=JSON.parse(fs.readFileSync('runtime-mode.json')),release=JSON.parse(fs.readFileSync('/srv/jouw-driver/release.json'));
          if(state.mode!=='public'||state.image!==release.image||state.revision!==release.revision||state.revision!==process.env.BASELINE) throw Error('Live application revision is outside the approved scope');
          const backup=fs.statSync('/srv/jouw-driver/backups/foundation-'+process.env.BACKUP+'.tar.age');
          if(backup.mtimeMs<Date.parse(state.deployedAt)) throw Error('Backup must cover live application');
          const compose=fs.readFileSync('private-app.yaml','utf8');
          const images=compose.match(/ghcr\.io\/infojouwdriver-commits\/jd@sha256:[a-f0-9]{64}/g);
          if(images?.length!==1||images[0]!==state.image||compose.includes('/app/cbe-open-data')) throw Error('Unexpected existing app configuration');
          BEFORE
          index_dir="$TRANSFER/cbe-open-data"
          test ! -e "$index_dir"
          mkdir "$index_dir"
          gzip -dc "$TRANSFER/index.gz" > "$index_dir/companies.sqlite"
          chgrp 10001 "$index_dir" "$index_dir/companies.sqlite" || sudo -n chgrp 10001 "$index_dir" "$index_dir/companies.sqlite"
          chmod 0750 "$index_dir"
          chmod 0640 "$index_dir/companies.sqlite"
          docker run --rm --network none --read-only --mount "type=bind,source=$index_dir,target=/registry,readonly" \
            --entrypoint node "$IMAGE" -e '
              const db=new (require("node:sqlite").DatabaseSync)("/registry/companies.sqlite",{readOnly:true});
              if(db.prepare("PRAGMA quick_check").get().quick_check!=="ok"||
                 db.prepare("SELECT count(*) AS count FROM companies").get().count!==1976860||
                 db.prepare("SELECT day FROM cbe_snapshot").get().day!=="2026-11-21") process.exit(1);
            '
          node --env-file=.database.env --input-type=module <<'MIGRATE'
          import fs from 'node:fs';
          import {spawnSync} from 'node:child_process';
          const {POSTGREST_SCHEMA,POSTGRES_DB,SCHEMA_ADMIN_USER,SCHEMA_USER,TRANSFER}=process.env;
          if(POSTGREST_SCHEMA!=='public'||POSTGRES_DB!=='jouw_driver'||![SCHEMA_ADMIN_USER,SCHEMA_USER].every(x=>/^[a-z_][a-z0-9_]{0,62}$/.test(x||''))) throw Error('Unexpected database scope');
          const read=name=>{
            const source=fs.readFileSync(TRANSFER+'/'+name,'utf8');
            if(!/^BEGIN;\s/m.test(source)||!/COMMIT;\s*$/.test(source)) throw Error('Unexpected migration transaction');
            return source.replace(/^BEGIN;\s/m,'').replace(/COMMIT;\s*$/,'').replaceAll(':"schema"','"public"').replaceAll(':"admin_role"','"'+SCHEMA_ADMIN_USER+'"').replaceAll(':"user_role"','"'+SCHEMA_USER+'"');
          };
          const signature='public.security_submit_social_company_subscription(uuid,text,jsonb,text,text)';
          const verify=`DO $$ BEGIN
            IF NOT has_function_privilege('${SCHEMA_ADMIN_USER}', '${signature}', 'EXECUTE')
               OR has_function_privilege('${SCHEMA_USER}', '${signature}', 'EXECUTE')
            THEN RAISE EXCEPTION 'Company social registration grants invalid'; END IF;
          END $$; NOTIFY pgrst, 'reload schema';`;
          const registration=read('20261017_company_registration.sql').match(
            /^CREATE OR REPLACE FUNCTION "public"\.security_submit_company_registration\([\s\S]*?^END \$\$;/m
          )?.[0];
          if(!registration) throw Error('Expected registration function not found');
          const sql=["BEGIN; SET LOCAL lock_timeout='5s';",registration,read('20261122_company_social_registration.sql'),verify,'COMMIT;'].join('\n');
          const result=spawnSync('docker',['compose','--env-file','.database.env','--project-name','jouw-driver','--file','compose.yaml','exec','-T','db','psql','-U','postgres','-d',POSTGRES_DB,'-v','ON_ERROR_STOP=1','-v','VERBOSITY=verbose','-Atq'],{input:sql,encoding:'utf8',timeout:30000});
          if(result.status!==0) throw Error('Registration migration failed ('+(/ERROR:\s+([0-9A-Z]{5}):/.exec(result.stderr||'')?.[1]||'unknown SQLSTATE')+')');
          MIGRATE
          changed=true
          export REGISTRY_INDEX="$index_dir"
          node --input-type=module <<'CONFIG'
          import fs from 'node:fs';
          const path='private-app.yaml';
          const current=fs.readFileSync(path,'utf8');
          const app=/^  app:\n(?:^    .*(?:\n|$)|^\n)*/m;
          if(!app.test(current)) throw Error('Expected the existing app service');
          const config=current.replace(app,service=>{
            const add=(yaml,key,line)=>{
              const header=new RegExp('^    '+key+':$','m');
              if(header.test(yaml)) return yaml.replace(header,s=>s+'\n'+line);
              if(new RegExp('^    '+key+':','m').test(yaml)) throw Error('Unexpected inline '+key);
              return yaml.trimEnd()+'\n    '+key+':\n'+line+'\n';
            };
            let yaml=service.replace(/ghcr\.io\/infojouwdriver-commits\/jd@sha256:[a-f0-9]{64}/,process.env.IMAGE);
            if(yaml===service) throw Error('Expected app image in the app service');
            yaml=add(yaml,'environment','      CBE_OPEN_DATA_PATH: /app/cbe-open-data/companies.sqlite');
            return add(yaml,'volumes','      - '+process.env.REGISTRY_INDEX+':/app/cbe-open-data:ro');
          });
          fs.writeFileSync(path,config,{mode:0o600});
          CONFIG
          docker compose --env-file .app-staging.env --project-name jouw-driver --file private-app.yaml up -d --no-deps --wait --wait-timeout 180 app </dev/null
          app=$(docker compose --env-file .app-staging.env --project-name jouw-driver --file private-app.yaml ps -q app)
          test "$(docker inspect --format '{{.Config.Image}}' "$app")" = "$IMAGE"
          test "$(docker inspect --format '{{.HostConfig.ReadonlyRootfs}}' "$app")" = true
          docker exec "$app" node scripts/preflight.mjs
          docker exec "$app" node scripts/database-readiness.mjs
          sha256sum --status --check "$work/preserved.sha256"
          node --input-type=module <<'ACCEPT'
          const base='https://app.jouww.com';
          const get=(url,options={})=>fetch(url,{...options,redirect:'error',signal:AbortSignal.timeout(15000)});
          for(const path of ['/','/register-company','/login','/driver-login','/privacy-policy']) {
            const response=await get(base+path);
            if(!response.ok||!response.headers.get('content-security-policy')?.includes("default-src 'self'")) throw Error('HTTPS smoke check failed for '+path);
          }
          for(const path of ['/next_api/companies/cbe','/next_api/companies/onboarding']){
            const response=await get(base+path,{method:'POST',headers:{Origin:base,'Content-Type':'application/json'},body:'{}'});
            if(response.status!==401) throw Error('Administration endpoint lost its authentication guard');
          }
          const lookup=await get(base+'/next_api/company-registrations/company-lookup',{
            method:'POST',headers:{Origin:base,'Content-Type':'application/json'},body:JSON.stringify({number:'0200065765',language:'nl'}),
          });
          if(!lookup.ok)throw Error('Live CBE lookup failed: HTTP '+lookup.status);
          const {data}=await lookup.json();
          if(data.source!=='cbe_open_data'||data.snapshot_date!=='2026-11-21'||data.name!=='Intergemeentelijke Vereniging Veneco'||!data.address?.includes('9070')) throw Error('Live CBE fields or source differ from the uploaded snapshot');
          console.log('Production registry populated the name and address from the Belgian Open Data snapshot.');
          ACCEPT
          node --input-type=module <<'STATE'
          import fs from 'node:fs';
          const old=JSON.parse(fs.readFileSync('runtime-mode.json'));
          const state={...old,image:process.env.IMAGE,revision:process.env.REVISION,deployedAt:new Date().toISOString(),previousImage:old.image,verifiedPrelaunchBackup:process.env.BACKUP,cbeSnapshot:'2026-11-21'};
          for(const file of ['runtime-mode.json','/srv/jouw-driver/release.json']){
            fs.writeFileSync(file+'.tmp',JSON.stringify(state,null,2)+'\n',{mode:0o600});
            fs.renameSync(file+'.tmp',file);
          }
          STATE
          succeeded=true
          rm -f "$TRANSFER/index.gz"
          printf 'Registration deployed and live registry verified.\n'
          REMOTE
