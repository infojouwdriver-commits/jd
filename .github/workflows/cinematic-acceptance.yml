name: Cinematic marketing browser acceptance
on:
  push:
    branches: [feat/marketing-cinematic-3d]
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: '22.18.0'
          package-manager-cache: false
      - run: npm install --global pnpm@11.25.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm build
        env:
          NEXT_TELEMETRY_DISABLED: '1'
      - name: Install isolated official browser test runtime
        run: |
          npm install --prefix "$RUNNER_TEMP/cinema-browser" --no-audit --no-fund --ignore-scripts playwright@1.56.1
          "$RUNNER_TEMP/cinema-browser/node_modules/.bin/playwright" install --with-deps chromium
      - name: Exercise real WebGL, reverse scroll and localized mobile pages
        env:
          UI_PLAYWRIGHT_PATH: ${{ runner.temp }}/cinema-browser/node_modules/playwright/index.mjs
          MARKETING_QA_DIR: ${{ runner.temp }}/cinema-evidence
          CINEMA_VIDEO: '1'
        run: node tests/run-marketing-ui.mjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: cinematic-browser-evidence
          path: ${{ runner.temp }}/cinema-evidence
          retention-days: 7
