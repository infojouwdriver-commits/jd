name: Publish JOUW DRIVER Android 0.3.3
on:
  push:
    branches: [main]
    paths: ['.github/workflows/publish-android-0-3-3.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    environment: production
    permissions:
      actions: read
      contents: write
    concurrency:
      group: public-android-signing
      cancel-in-progress: false
    steps:
      - name: Verify and fetch the reviewed Android binary
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_RUN: '46139893866'
          ARTIFACT: '15261498788'
          REVISION: '1920c7edae669c36e41a2592bd2aba04a9f9d908'
          ARCHIVE_HASH: '3ca0e39cdba13c05f5708ac22b5f305ae5874ed052424d959d27021a714c157c'
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$BUILD_RUN" |
            jq -e --arg revision "$REVISION" '.event=="workflow_dispatch" and .status=="completed" and .head_sha==$revision and .path==".github/workflows/native-driver.yml"' >/dev/null
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$BUILD_RUN/jobs" |
            jq -e '[.jobs[]|select(.conclusion=="success")|.name] | (index("android")!=null and index("visual-review")!=null)' >/dev/null
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$BUILD_RUN/artifacts" |
            jq -e --arg id "$ARTIFACT" --arg rev "$REVISION" --arg hash "$ARCHIVE_HASH" '.artifacts|any((.id|tostring)==$id and .name==("driver-android-preview-"+$rev) and .expired==false and .digest==("sha256:"+$hash))' >/dev/null
          mkdir "$RUNNER_TEMP/android-preview"
          archive="$RUNNER_TEMP/android-preview/preview.zip"
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$ARTIFACT/zip" > "$archive"
          printf '%s  %s\n' "$ARCHIVE_HASH" "$archive" | sha256sum --check
          test "$(unzip -Z1 "$archive")" = app-release.apk
          unzip -p "$archive" app-release.apk > "$RUNNER_TEMP/android-preview/app-release.apk"
      - name: Sign and verify compatibility with the current APK
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          set -Eeuo pipefail
          trap 'printf "APK signing stopped at line %s\n" "$LINENO" >&2' ERR
          umask 077
          [[ "$DEPLOY_HOST" =~ ^[a-zA-Z0-9][a-zA-Z0-9.-]*$ && "$DEPLOY_USER" =~ ^[a-z_][a-z0-9_-]*$ ]]
          test -n "$DEPLOY_KEY" && test -n "$KNOWN_HOSTS"
          work=$(mktemp -d)
          trap 'rm -rf "$work"' EXIT
          printf '%s\n' "$DEPLOY_KEY" > "$work/ssh-key"
          printf '%s\n' "$KNOWN_HOSTS" > "$work/known_hosts"
          args=(-i "$work/ssh-key" -o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$work/known_hosts" -o ConnectTimeout=20)
          host="$DEPLOY_USER@$DEPLOY_HOST"
          tool=$(find "$ANDROID_HOME/build-tools" -mindepth 2 -maxdepth 2 -name apksigner -print | sort -V | tail -1)
          test -x "$tool"
          export JAVA_HOME="${JAVA_HOME_17_X64:?Java 17 is required}"
          export PATH="$JAVA_HOME/bin:$PATH"
          preview="$RUNNER_TEMP/android-preview/app-release.apk"
          output="$RUNNER_TEMP/JOUW-DRIVER-Android-0.3.3.apk"
          package_id=$("$(dirname "$tool")/aapt" dump badging "$preview" | sed -n '1p')
          printf 'Candidate %s\n' "$package_id"
          [[ "$package_id" == "package: name='be.jouwdriver.driver' versionCode='15' versionName='0.3.3'"* ]]
          "$tool" verify "$preview"
          signing=/srv/jouw-driver/android-release-signing
          ssh "${args[@]}" "$host" "cat '$signing/release.p12'" > "$work/release.p12"
          ssh "${args[@]}" "$host" "cat '$signing/password'" > "$work/password"
          curl --fail --silent --show-error --location --retry 2 --max-time 75 \
            "https://github.com/$GITHUB_REPOSITORY/releases/download/android-direct/jouw-driver.apk" \
            --output "$work/published.apk"
          certificate() {
            "$tool" verify "$1"
            python3 - "$1" <<'CERT'
          import hashlib, struct, sys
          from pathlib import Path

          def certificate(path):
              apk = Path(path).read_bytes()
              eocd = apk.rfind(b'PK\x05\x06')
              directory = struct.unpack_from('<I', apk, eocd + 16)[0]
              if apk[directory - 16:directory] != b'APK Sig Block 42':
                  raise ValueError('APK signature block missing')
              end = directory - 24
              offset = directory - struct.unpack_from('<Q', apk, end)[0]

              def read_field(data, start=0):
                  size = struct.unpack_from('<I', data, start)[0]
                  stop = start + 4 + size
                  return data[start + 4:stop], stop

              while offset < end:
                  size, block_id = struct.unpack_from('<QI', apk, offset)
                  block = apk[offset + 12:offset + 8 + size]
                  offset += 8 + size
                  if block_id == 0x7109871a:
                      signers, _ = read_field(block)
                      signer, stop = read_field(signers)
                      if stop != len(signers):
                          raise ValueError('Expected a single Android release signer')
                      signed_data, _ = read_field(signer)
                      _, offset = read_field(signed_data)
                      certificates, _ = read_field(signed_data, offset)
                      certificate, _ = read_field(certificates)
                      return hashlib.sha256(certificate).hexdigest()
              raise ValueError('APK v2 signature missing')

          print(certificate(sys.argv[1]))
          CERT
          }
          published_cert=$(certificate "$work/published.apk")
          printf 'Published certificate %s\n' "$published_cert"
          [[ "$published_cert" =~ ^[a-f0-9]{64}$ ]]
          "$tool" sign --ks "$work/release.p12" --ks-type PKCS12 --ks-pass "file:$work/password" \
            --ks-key-alias jouw-driver-android --v2-signing-enabled true --v4-signing-enabled false \
            --out "$output" "$preview"
          signed_cert=$(certificate "$output")
          printf 'Candidate certificate %s\n' "$signed_cert"
          test "$signed_cert" = "$published_cert"
          python3 - "$preview" "$output" <<'PYCODE'
          import hashlib, re, sys, zipfile

          def payload(path):
              with zipfile.ZipFile(path) as apk:
                  return {
                      item.filename: hashlib.sha256(apk.read(item)).digest()
                      for item in apk.infolist()
                      if not item.is_dir() and not re.fullmatch(r'META-INF/(?:MANIFEST\.MF|[^/]+\.(?:SF|RSA|DSA|EC))', item.filename, re.I)
                  }

          if payload(sys.argv[1]) != payload(sys.argv[2]):
              raise SystemExit('APK signing changed the reviewed application payload')
          PYCODE
          sha256sum "$output"
      - name: Publish the verified APK at the existing download URL
        env:
          GH_TOKEN: ${{ github.token }}
          WEB_ROLLOUT: '46139142129'
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$WEB_ROLLOUT" |
            jq -e '.status=="completed" and .conclusion=="success" and .path==".github/workflows/publish-legal-driver-maps.yml"' >/dev/null
          work=$(mktemp -d)
          trap 'rm -rf "$work"' EXIT
          mkdir "$work/previous" "$work/next"
          cp "$RUNNER_TEMP/JOUW-DRIVER-Android-0.3.3.apk" "$work/next/jouw-driver.apk"
          tag=android-direct
          gh release download "$tag" --repo "$GITHUB_REPOSITORY" --pattern jouw-driver.apk --dir "$work/previous"
          download() {
            curl --fail --silent --show-error --location --retry 2 --max-time 90 \
              -H 'Cache-Control: no-cache' \
              "https://github.com/$GITHUB_REPOSITORY/releases/download/$tag/jouw-driver.apk?run=$GITHUB_RUN_ID" --output "$work/public.apk"
          }
          if ! gh release upload "$tag" "$work/next/jouw-driver.apk" --repo "$GITHUB_REPOSITORY" --clobber ||
             ! download || ! cmp "$work/public.apk" "$work/next/jouw-driver.apk"; then
            gh release upload "$tag" "$work/previous/jouw-driver.apk" --repo "$GITHUB_REPOSITORY" --clobber
            exit 1
          fi
          gh release edit "$tag" --repo "$GITHUB_REPOSITORY" --title 'JOUW DRIVER Android · 0.3.3 (15)'
          sha256sum "$work/public.apk"
