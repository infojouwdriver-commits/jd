name: Refresh code reference for the Chiron receipt fix
on:
  push:
    branches: [fix/chiron-http-201]
    paths: ['.github/workflows/refresh-chiron-201-map.yml']
permissions:
  contents: write
jobs:
  reference:
    runs-on: ubuntu-24.04
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
      - name: Regenerate the local AST reference and remove this one-use workflow
        shell: bash
        run: |
          set -euo pipefail
          [[ "$GITHUB_REPOSITORY" == infojouwdriver-commits/jd && "$GITHUB_REF" == refs/heads/fix/chiron-http-201 ]]
          python3 -m venv "$RUNNER_TEMP/code-map"
          "$RUNNER_TEMP/code-map/bin/python" -m pip install -r scripts/requirements-code-map.txt
          "$RUNNER_TEMP/code-map/bin/python" scripts/code-map.py
          python3 scripts/code-map.py --check
          git add graphify-out/
          git rm .github/workflows/refresh-chiron-201-map.yml
          git diff --cached --name-only | python3 -c 'import sys; paths=sys.stdin.read().splitlines(); assert paths and all(p.startswith("graphify-out/") or p==".github/workflows/refresh-chiron-201-map.yml" for p in paths)'
          git -c user.name=github-actions -c user.email=github-actions@users.noreply.github.com commit -m 'Regenerate Chiron code reference'
          git push origin HEAD:refs/heads/fix/chiron-http-201
