name: Native driver application
on:
  pull_request:
    paths: ['driver-app/**', '.github/workflows/native-driver.yml']
  push:
    branches: ['feat/native-driver-app-20261014', 'release/ios-unified-20261115']
    paths: ['driver-app/**', '.github/workflows/native-driver.yml']
  workflow_dispatch:
    inputs:
      build_ios:
        description: Build and probe the iOS simulator (deferred for Android-first delivery)
        type: boolean
        default: false
      upload_testflight:
        description: Build a signed iPhone release and upload to TestFlight
        type: boolean
        default: false
      sign_android:
        description: Produce an APK signed with the existing Android release key
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: native-driver-${{ github.ref }}
  cancel-in-progress: true
jobs:
  android:
    if: github.ref != 'refs/heads/release/ios-unified-20261115' && (github.event_name != 'workflow_dispatch' || !inputs.upload_testflight || inputs.sign_android)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: driver-app
    env:
      EXPO_PUBLIC_MAPBOX_ACCESS_TOKEN: ${{ secrets.MAPBOX_NATIVE_PUBLIC_TOKEN || secrets.MAPBOX_PUBLIC_TOKEN }}
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: '22.18.0'
          package-manager-cache: false
          cache: npm
          cache-dependency-path: driver-app/package-lock.json
      - run: npm ci
      - name: Verify native Mapbox access without a browser referrer
        run: node scripts/check-mapbox-access.mjs
      - run: npm run lint && npm run typecheck && npm test && npx expo install --check
      - run: npx expo prebuild --platform android --no-install
      - name: Compile bundled preview application
        # Match the Java 17 toolchain used by Expo SDK 57's Android builders.
        run: |
          export JAVA_HOME="${JAVA_HOME_17_X64:?Java 17 is required}"
          export PATH="$JAVA_HOME/bin:$PATH"
          java -version
          ./android/gradlew -p android assembleRelease --no-daemon --stacktrace -PreactNativeArchitectures=arm64-v8a
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: driver-android-preview-${{ github.sha }}
          path: driver-app/android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 14
  android-release:
    if: github.event_name == 'workflow_dispatch' && inputs.sign_android
    needs: [android, visual-review]
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    environment: production
    concurrency:
      group: public-android-signing
      cancel-in-progress: false
    steps:
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0
        with:
          name: driver-android-preview-${{ github.sha }}
          path: ${{ runner.temp }}/android-preview
      - name: Sign APK and verify compatibility with the published Android app
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          set -Eeuo pipefail
          umask 077
          [[ "$DEPLOY_HOST" =~ ^[a-zA-Z0-9][a-zA-Z0-9.-]*$ && "$DEPLOY_USER" =~ ^[a-z_][a-z0-9_-]*$ ]]
          test -n "$DEPLOY_KEY" && test -n "$KNOWN_HOSTS"
          work=$(mktemp -d)
          trap 'rm -rf "$work"' EXIT
          printf '%s\n' "$DEPLOY_KEY" > "$work/ssh-key"
          printf '%s\n' "$KNOWN_HOSTS" > "$work/known_hosts"
          args=(-i "$work/ssh-key" -o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$work/known_hosts" -o ConnectTimeout=20)
          host="$DEPLOY_USER@$DEPLOY_HOST"
          tool=$(find "$ANDROID_HOME/build-tools" -mindepth 2 -maxdepth 2 -name apksigner -print | sort -V | tail -1)
          test -x "$tool"
          export JAVA_HOME="${JAVA_HOME_17_X64:?Java 17 is required}"
          export PATH="$JAVA_HOME/bin:$PATH"
          preview="$RUNNER_TEMP/android-preview/app-release.apk"
          output="$RUNNER_TEMP/JOUW-DRIVER-Android-0.3.3.apk"
          package_id=$("$(dirname "$tool")/aapt" dump badging "$preview" | sed -n '1p')
          [[ "$package_id" == "package: name='be.jouwdriver.driver' versionCode='15' versionName='0.3.3'"* ]]
          "$tool" verify "$preview"
          signing=/srv/jouw-driver/android-release-signing
          ssh "${args[@]}" "$host" "cat '$signing/release.p12'" > "$work/release.p12"
          ssh "${args[@]}" "$host" "cat '$signing/password'" > "$work/password"
          curl --fail --silent --show-error --location --retry 2 --max-time 75 \
            "https://github.com/$GITHUB_REPOSITORY/releases/download/android-direct/jouw-driver.apk" \
            --output "$work/published.apk"
          certificate() {
            "$tool" verify --print-certs "$1" | awk -F ': ' '/certificate SHA-256 digest:/ {print $2}'
          }
          published_cert=$(certificate "$work/published.apk")
          [[ "$published_cert" =~ ^[a-f0-9]{64}$ ]]
          "$tool" sign --ks "$work/release.p12" --ks-type PKCS12 --ks-pass "file:$work/password" \
            --ks-key-alias jouw-driver-android --v2-signing-enabled true --v4-signing-enabled false \
            --out "$output" "$preview"
          test "$(certificate "$output")" = "$published_cert"
          python3 - "$preview" "$output" <<'PYCODE'
          import hashlib, re, sys, zipfile

          def payload(path):
              with zipfile.ZipFile(path) as apk:
                  return {
                      item.filename: hashlib.sha256(apk.read(item)).digest()
                      for item in apk.infolist()
                      if not item.is_dir() and not re.fullmatch(r'META-INF/(?:MANIFEST\.MF|[^/]+\.(?:SF|RSA|DSA|EC))', item.filename, re.I)
                  }

          if payload(sys.argv[1]) != payload(sys.argv[2]):
              raise SystemExit('APK signing changed the reviewed application payload')
          PYCODE
          sha256sum "$output"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: driver-android-release-${{ github.sha }}
          path: ${{ runner.temp }}/JOUW-DRIVER-Android-0.3.3.apk
          if-no-files-found: error
          retention-days: 14
  visual-review:
    if: github.ref != 'refs/heads/release/ios-unified-20261115' && (github.event_name != 'workflow_dispatch' || !inputs.upload_testflight || inputs.sign_android)
    # Playwright 1.56.1 supports Ubuntu 24.04.
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: driver-app
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: '22.18.0'
          package-manager-cache: false
      - run: npm ci && npm ci --prefix visual-review
      - run: node visual-review/node_modules/playwright/cli.js install --with-deps chromium
      - run: node visual-review/review.cjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: driver-android-visual-review-${{ github.sha }}
          path: |
            driver-app/build/visual-review/*.png
            driver-app/build/visual-review/*.webm
            driver-app/build/visual-review/result.json
          if-no-files-found: error
          retention-days: 14
  ios-simulator:
    if: (github.event_name == 'workflow_dispatch' && inputs.build_ios) || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: macos-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: driver-app
    env:
      EXPO_PUBLIC_NATIVE_SMOKE_ID: ${{ github.run_id }}-${{ github.run_attempt }}
      EXPO_PUBLIC_MAPBOX_ACCESS_TOKEN: ${{ secrets.MAPBOX_NATIVE_PUBLIC_TOKEN || secrets.MAPBOX_PUBLIC_TOKEN }}
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: '22.18.0'
          package-manager-cache: false
          cache: npm
          cache-dependency-path: driver-app/package-lock.json
      - run: npm ci
      - name: Verify native Mapbox access without a browser referrer
        run: node scripts/check-mapbox-access.mjs
      - run: npx expo prebuild --platform ios --no-install
      - name: Warm simulator during native compilation
        run: |
          jd_simulator_id=$(xcrun simctl list devices available --json | python3 -c 'import sys,json; print(next(d["udid"] for devices in json.load(sys.stdin)["devices"].values() for d in devices if "iPhone" in d["name"]))')
          echo "JD_IOS_SIMULATOR_ID=$jd_simulator_id" >> "$GITHUB_ENV"
          xcrun simctl boot "$jd_simulator_id"
      - name: Install native CocoaPods dependencies
        run: cd ios && pod install
      - name: Compile unsigned simulator application
        run: xcodebuild -workspace ios/JOUWDRIVER.xcworkspace -scheme JOUWDRIVER -configuration Release -sdk iphonesimulator -derivedDataPath build/ios -arch arm64 CODE_SIGNING_ALLOWED=NO build
      - name: Launch simulator smoke test
        run: |
          simulator_id="$JD_IOS_SIMULATOR_ID"
          xcrun simctl bootstatus "$simulator_id" -b
          xcrun simctl install "$simulator_id" build/ios/Build/Products/Release-iphonesimulator/JOUWDRIVER.app
          trap 'xcrun simctl io "$simulator_id" screenshot build/ios/driver-login-simulator.png || true; python3 scripts/simulator-diagnostics.py' EXIT
          xcrun simctl launch --console "$simulator_id" be.jouwdriver.driver > build/ios/simulator-console.raw 2>&1 &
          simulator_console_pid=$!
          sleep 20
          # --console remains attached while the app is alive; crash/exit must fail acceptance.
          kill -0 "$simulator_console_pid"
          xcrun simctl spawn "$simulator_id" launchctl list | awk '$3 ~ /be[.]jouwdriver[.]driver/ && $1 ~ /^[0-9]+$/ && $1 > 0 {found=1} END {exit !found}'
          if grep -Eq 'Unhandled JS Exception|Terminating app due|RCTFatalException' build/ios/simulator-console.raw; then exit 1; fi
          # Compilation alone cannot prove native AES bridge compatibility.
          simulator_container=$(xcrun simctl get_app_container "$simulator_id" be.jouwdriver.driver data)
          python3 scripts/check-native-crypto-result.py "$simulator_container" "$EXPO_PUBLIC_NATIVE_SMOKE_ID"
          xcrun simctl io "$simulator_id" screenshot build/ios/driver-login-simulator.png
      - name: Preserve simulator application package
        run: ditto -c -k --sequesterRsrc --keepParent build/ios/Build/Products/Release-iphonesimulator/JOUWDRIVER.app build/ios/JOUWDRIVER-simulator.zip
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: driver-ios-simulator-${{ github.sha }}
          path: |
            driver-app/build/ios/JOUWDRIVER-simulator.zip
            driver-app/build/ios/driver-login-simulator.png
            driver-app/build/ios/simulator-diagnostics.txt
            driver-app/build/ios/native-crypto-result.json
          if-no-files-found: error
          retention-days: 14

  ios-testflight:
    if: (github.event_name == 'workflow_dispatch' && inputs.upload_testflight) || (github.event_name == 'push' && github.ref == 'refs/heads/release/ios-unified-20261115')
    runs-on: macos-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: driver-app
    env:
      EXPO_PUBLIC_MAPBOX_ACCESS_TOKEN: ${{ secrets.MAPBOX_NATIVE_PUBLIC_TOKEN || secrets.MAPBOX_PUBLIC_TOKEN }}
      JD_IOS_MANUAL_SIGNING: '1'
      JD_IOS_MARKETING_VERSION: '1.2'
      JD_IOS_BUILD_NUMBER: 1.${{ github.run_number }}.${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: '22.18.0'
          package-manager-cache: false
          cache: npm
          cache-dependency-path: driver-app/package-lock.json
      - run: npm ci
      - name: Verify mobile source and dependencies
        run: npm run lint && npm run typecheck && npm test && npx expo install --check
        env:
          JD_IOS_MANUAL_SIGNING: '0'
      - name: Verify native Mapbox access
        run: node scripts/check-mapbox-access.mjs
      - name: Prepare isolated signing keychain and profile
        run: python3 scripts/ios-signing.py prepare
        env:
          IOS_SIGNING_JSON: ${{ secrets.IOS_TESTFLIGHT_SIGNING_JSON }}
          JD_IOS_CARPLAY_PROFILE: ${{ secrets.IOS_CARPLAY_PROVISIONING_PROFILE }}
      - name: Configure distribution for this build
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const config = require('./app.config.js');
          config.expo.version = process.env.JD_IOS_MARKETING_VERSION;
          config.expo.ios.buildNumber = process.env.JD_IOS_BUILD_NUMBER;
          config.expo.plugins.unshift('./plugins/with-ios-distribution');
          fs.writeFileSync('app.config.js', 'module.exports = ' + JSON.stringify(config, null, 2) + ';\n');
          NODE
      - run: npx expo prebuild --platform ios --no-install
      - name: Install native dependencies
        run: cd ios && pod install
      - name: Archive signed iPhone application
        run: >-
          xcodebuild -quiet -workspace ios/JOUWDRIVER.xcworkspace -scheme JOUWDRIVER
          -configuration Release -destination 'generic/platform=iOS'
          -archivePath build/ios/JOUWDRIVER.xcarchive archive
      - name: Export App Store application
        run: >-
          xcodebuild -exportArchive -archivePath build/ios/JOUWDRIVER.xcarchive
          -exportOptionsPlist "$JD_IOS_SIGNING_DIR/ExportOptions.plist" -exportPath build/ios/export
      - name: Upload signed application to TestFlight
        run: >-
          xcrun altool --upload-app --type ios --file build/ios/export/JOUWDRIVER.ipa
          --apiKey "$JD_ASC_KEY_ID" --apiIssuer "$JD_ASC_ISSUER"
      - name: Preserve signed iPhone package
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: driver-ios-testflight-${{ github.sha }}
          path: driver-app/build/ios/export/*.ipa
          if-no-files-found: error
          retention-days: 14
      - name: Verify Apple processed the uploaded build
        env:
          IOS_SIGNING_JSON: ${{ secrets.IOS_TESTFLIGHT_SIGNING_JSON }}
        run: node scripts/verify-testflight.mjs
      - name: Remove signing credentials from runner
        if: always()
        run: python3 scripts/ios-signing.py cleanup
