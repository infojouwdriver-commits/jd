name: Native driver application
on:
  pull_request:
    paths: ['driver-app/**', '.github/workflows/native-driver.yml']
  push:
    branches: ['feat/native-driver-app-20261014']
    paths: ['driver-app/**', '.github/workflows/native-driver.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: native-driver-${{ github.ref }}
  cancel-in-progress: true
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: driver-app
    env:
      EXPO_PUBLIC_MAPBOX_ACCESS_TOKEN: ${{ secrets.MAPBOX_PUBLIC_TOKEN }}
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: '22.18.0'
          package-manager-cache: false
          cache: npm
          cache-dependency-path: driver-app/package-lock.json
      - run: npm ci
      - run: npm run lint && npm run typecheck && npm test && npx expo install --check
      - run: npx expo prebuild --platform android --no-install
      - name: Compile bundled preview application
        run: ./android/gradlew -p android assembleRelease --no-daemon
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: driver-android-preview-${{ github.sha }}
          path: driver-app/android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 14
  ios-simulator:
    runs-on: macos-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: driver-app
    env:
      EXPO_PUBLIC_MAPBOX_ACCESS_TOKEN: ${{ secrets.MAPBOX_PUBLIC_TOKEN }}
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: '22.18.0'
          package-manager-cache: false
          cache: npm
          cache-dependency-path: driver-app/package-lock.json
      - run: npm ci
      - run: npx expo prebuild --platform ios --no-install
      - name: Install native CocoaPods dependencies
        run: cd ios && pod install
      - name: Compile unsigned simulator application
        run: xcodebuild -workspace ios/JOUWDRIVER.xcworkspace -scheme JOUWDRIVER -configuration Release -sdk iphonesimulator -derivedDataPath build/ios CODE_SIGNING_ALLOWED=NO build
      - name: Launch simulator smoke test
        run: |
          simulator_id=$(xcrun simctl list devices available --json | python3 -c 'import sys,json; print(next(d["udid"] for devices in json.load(sys.stdin)["devices"].values() for d in devices if "iPhone" in d["name"]))')
          xcrun simctl boot "$simulator_id"
          xcrun simctl bootstatus "$simulator_id" -b
          xcrun simctl install "$simulator_id" build/ios/Build/Products/Release-iphonesimulator/JOUWDRIVER.app
          xcrun simctl launch "$simulator_id" be.jouwdriver.driver
          sleep 20
          xcrun simctl io "$simulator_id" screenshot build/ios/driver-login-simulator.png
      - name: Preserve simulator application package
        run: ditto -c -k --sequesterRsrc --keepParent build/ios/Build/Products/Release-iphonesimulator/JOUWDRIVER.app build/ios/JOUWDRIVER-simulator.zip
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: driver-ios-simulator-${{ github.sha }}
          path: |
            driver-app/build/ios/JOUWDRIVER-simulator.zip
            driver-app/build/ios/driver-login-simulator.png
          if-no-files-found: error
          retention-days: 14
